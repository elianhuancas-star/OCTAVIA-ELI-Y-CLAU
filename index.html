<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Octavia</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Octavia v6 — diseño «Coro»: fondo gris claro, tarjetas blancas, un solo acento azul, Plus Jakarta Sans.
   Menú lateral oscuro (computadora) / barra inferior blanca (celular) · consola de práctica fija abajo.
   Los nombres de variables de la v5 se conservan para no tocar el JavaScript; sus valores ahora son los del kit. */
:root{
  /* Tokens del kit «Coro» */
  --fondo:#F3F5F9; --superficie:#FFFFFF; --tinta:#18202E; --suave:#5B6474; --linea:#DDE2EA; --linea-campo:#C9D0DC;
  --gris-claro:#EEF1F6; --punteado:#A9B2C2;
  --acento:#2F49C9; --acento-oscuro:#1E338F; --acento-suave:#E6EAFB;
  --exito:#0F766E; --exito-oscuro:#0B5A53; --exito-suave:#DDF2EC;
  --aviso:#7A3D00; --aviso-suave:#FBE9D7; --meta:#6B4E00; --meta-suave:#FFF3C9; --rojo:#C2312F;
  --cat1-f:#FBE4EC; --cat1-t:#8A1F4A; --cat2-f:#E4E8FF; --cat2-t:#1E338F; --cat3-f:#ECEEF3; --cat3-t:#323A4A;
  --cat4-f:#FFF3C9; --cat4-t:#6B4E00; --cat5-f:#DCEBFB; --cat5-t:#1A4A80; --cat6-f:#DDF2EC; --cat6-t:#0B5A53;
  --cat7-f:#FCEBDA; --cat7-t:#7A3D00; --cat8-f:#F2E7F6; --cat8-t:#62277A;
  /* Nombres de Octavia → valores Coro */
  --bg:var(--fondo); --surface:#FFFFFF; --surface-2:var(--gris-claro); --ink:var(--tinta); --muted:var(--suave); --line:var(--linea);
  --brand:var(--acento); --brand-hi:var(--acento-oscuro); --brand-deep:var(--acento-oscuro); --brand-soft:var(--acento-suave); --brand-text:var(--acento);
  --sun:var(--meta-suave); --sun-soft:var(--meta-suave); --sun-text:var(--meta);
  --coral:var(--aviso-suave); --coral-soft:var(--aviso-suave); --coral-text:var(--aviso);
  --green:var(--exito-suave); --green-soft:var(--exito-suave); --green-text:var(--exito-oscuro); --green-ink:var(--exito);
  --ivory:#FFFFFF; --carbon:var(--tinta); --console:var(--tinta);
  --on-sun:var(--meta); --on-coral:var(--aviso); --on-green:var(--exito-oscuro);
  --shadow:none;
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-s:10px; --r-m:14px; --r-l:18px; --toque:44px;
  --rail:232px; --console-h:76px;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.02em}
h1{font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.1}
h2{font-size:1.2rem;line-height:1.2}
h3{font-size:.98rem;line-height:1.25}
h4{font-size:.9rem;line-height:1.3}
p{margin:0}
a{color:var(--brand-text)}
.eyebrow{font:500 .62rem/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.ic.sm{width:16px;height:16px}

/* Shell */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;align-self:start;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:18px;padding:calc(18px + env(safe-area-inset-top,0px)) 10px 18px max(10px,env(safe-area-inset-left,0px))}
.mark{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink)}
.mark .sq{width:48px;height:48px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;position:relative;font:700 1.1rem/1 var(--f-display)}
.mark .sq::before{content:"8va";position:absolute;top:5px;left:7px;right:6px;font:italic 600 .42rem/1 var(--f-body);color:var(--sun);border-bottom:1px dashed var(--sun);padding-bottom:2px;text-align:left}
.mark .sq span{margin-top:8px}
.mark small{font:600 .52rem/1 var(--f-display);letter-spacing:.14em}
.side-nav{display:flex;flex-direction:column;gap:6px;width:100%}
.side-nav a{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:16px;color:var(--muted);text-decoration:none;font:600 .66rem/1.1 var(--f-body);text-align:center;position:relative;transition:background .15s,color .15s}
.side-nav a .ic{width:22px;height:22px}
.side-nav a:hover{background:var(--surface-2);color:var(--ink)}
.side-nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-text)}
.side-nav a:focus-visible,.tabbar a:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.side-nav .dot-badge{position:absolute;top:6px;right:12px}
.dot-badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--coral);color:var(--on-coral);font:600 .6rem/18px var(--f-mono);text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.fork{appearance:none;border:0;background:var(--surface-2);color:var(--ink);border-radius:14px;width:100%;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font:600 .58rem/1.1 var(--f-mono)}
.fork:hover{background:var(--brand-soft);color:var(--brand-text)}
.fork:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.mode{display:flex;flex-direction:column;gap:4px;width:100%}
.mode .seg{display:flex;flex-direction:column;gap:3px;background:var(--surface-2);border-radius:14px;padding:4px}
.mode .seg button{appearance:none;border:0;border-radius:10px;padding:7px 2px;font:600 .62rem/1 var(--f-body);background:transparent;color:var(--muted);cursor:pointer}
.mode .seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.mode .seg button:focus-visible{outline:2px solid var(--brand-hi);outline-offset:1px}
.mode small{font:500 .52rem/1.2 var(--f-mono);color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.mode .del{appearance:none;border:0;background:transparent;color:var(--coral-text);font:600 .58rem/1.2 var(--f-body);cursor:pointer;padding:4px}
.me{display:flex;flex-direction:column;align-items:center;gap:4px}
.me .av{width:40px;height:40px;border-radius:14px;background:var(--sun);color:var(--on-sun);display:grid;place-items:center;font:700 .95rem/1 var(--f-display)}
.me b{font-size:.66rem;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{display:none}
.maincol{min-width:0;display:flex;flex-direction:column}
.appbar{display:none}
main{padding:28px max(16px,env(safe-area-inset-right,0px)) calc(var(--console-h) + 40px) 32px;width:100%;max-width:1080px;margin:0 auto}
.tabbar{display:none}

.page{display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head .t{display:flex;flex-direction:column;gap:6px}
.page-head[class*="ph-"]{border-radius:var(--r-l);padding:22px 24px;position:relative;overflow:hidden}
.page-head[class*="ph-"]>*{position:relative;z-index:1}
.page-head[class*="ph-"]::after{content:"";position:absolute;inset:auto -10px -40px auto;width:260px;height:120px;background:repeating-linear-gradient(0deg,currentColor 0 1px,transparent 1px 9px);opacity:.12;pointer-events:none}
.ph-brand{background:var(--brand);color:#fff}.ph-brand h1{color:#fff}.ph-brand .eyebrow{color:var(--sun)}.ph-brand .muted{color:#E6D9F4}
.ph-brand .btn-primary{background:var(--sun);border-color:var(--sun);color:var(--on-sun);box-shadow:none}
.ph-brand .btn:not(.btn-primary){background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.ph-coral{background:var(--coral);color:var(--on-coral)}.ph-sun{background:var(--sun);color:var(--on-sun)}.ph-green{background:var(--green);color:var(--on-green)}
.ph-coral .eyebrow,.ph-coral .muted,.ph-sun .eyebrow,.ph-sun .muted,.ph-green .eyebrow,.ph-green .muted{color:inherit;opacity:.8}
.ph-coral .btn-ghost,.ph-sun .btn-ghost,.ph-green .btn-ghost{color:inherit}
.ph-green .person{box-shadow:none}

/* Botones */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .88rem/1 var(--f-body);padding:12px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:var(--brand-hi)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-hi);border-color:var(--brand-hi)}
.btn-sun{background:var(--sun);border-color:var(--sun);color:var(--on-sun)}
.btn-sun:hover{border-color:var(--on-sun)}
.btn-coral{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.btn-coral:hover{border-color:var(--on-coral)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px}
.btn-ghost:hover{color:var(--ink);border-color:transparent;background:var(--surface-2)}
.btn-glass{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.btn-glass:hover{border-color:#fff}
.btn-sm{padding:8px 13px;font-size:.8rem}
.icon-btn{appearance:none;width:38px;height:38px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;transition:transform .12s,border-color .15s}
.icon-btn:hover{border-color:var(--brand-hi)}
.icon-btn:active{transform:scale(.94)}
.icon-btn:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}

/* Campos */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.8rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0;width:100%}
textarea{resize:vertical;min-height:84px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--brand-hi);box-shadow:0 0 0 4px var(--brand-soft)}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--brand)}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:1/-1}
.err{color:var(--coral-text);font-size:.85rem;font-weight:600}
.hint{font-size:.85rem;color:var(--muted)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .72rem/1 var(--f-body);padding:6px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.brand{background:var(--brand-soft);color:var(--brand-text)}
.chip.sun{background:var(--sun-soft);color:var(--sun-text)}
.chip.coral{background:var(--coral-soft);color:var(--coral-text)}
.chip.green{background:var(--green-soft);color:var(--green-text)}
button.chip{border:0;cursor:pointer;font-family:var(--f-body);padding:9px 14px;font-size:.8rem}
button.chip:hover{background:var(--brand-soft);color:var(--brand-text)}
button.chip[aria-pressed="true"]{background:var(--brand);color:#fff}
button.chip:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}

/* Superficies */
.card{background:var(--surface);border-radius:var(--r-l);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;min-width:0}
.plain{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2,.sec-h h3{display:flex;align-items:center;gap:10px}
.sec-h h3 .ic{color:var(--brand-text)}
.tile-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}

/* HOY — encabezado de estado */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
.hello .t{display:flex;flex-direction:column;gap:6px}
.stats-pills{display:flex;flex-wrap:wrap;gap:8px}
.sp{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:8px 14px 8px 8px;box-shadow:var(--shadow);font-size:.82rem}
.sp .dot{width:30px;height:30px;border-radius:999px;display:grid;place-items:center}
.sp .dot .ic{width:16px;height:16px}
.sp b{font-family:var(--f-mono);font-weight:500;font-size:.8rem}
.sp .bar{width:64px;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.sp .bar i{display:block;height:100%;background:var(--coral);border-radius:9px}

/* Teclado de la semana */
.week{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 26px;align-items:center}
.week .txt{display:flex;flex-direction:column;gap:6px}
.week .txt b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.keys{display:flex;gap:6px;position:relative}
.key{appearance:none;width:54px;height:96px;border-radius:6px 6px 14px 14px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:0 0 10px;cursor:pointer;font:600 .62rem/1 var(--f-mono);position:relative;transition:transform .12s,background .2s}
.key:active{transform:translateY(2px)}
.key:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.key .mk{width:24px;height:24px;border-radius:8px;display:grid;place-items:center}
.key .mk .ic{width:14px;height:14px}
.key.met{background:var(--green);border-color:var(--green);color:var(--on-green)}
.key.met .mk{background:var(--on-green);color:var(--green)}
.key.miss{background:var(--coral-soft);border-color:var(--coral-soft);color:var(--coral-text)}
.key.today{border:2.5px solid var(--sun);color:var(--ink)}
.key.today::before{content:"hoy";position:absolute;top:8px;font:600 .55rem/1 var(--f-mono);color:var(--sun-text);letter-spacing:.08em;text-transform:uppercase}
.key.rest{background:var(--carbon);border-color:var(--carbon);color:var(--ivory)}
.key.rest .mk{font:400 1.2rem/1 serif;color:var(--sun)}
.key.sel{box-shadow:0 0 0 3px var(--brand-soft)}
.keyinfo{grid-column:1/-1;font-size:.86rem;color:var(--muted);min-height:1.3em}

/* Atril (hero) */
.stand{border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.stand-top{background:var(--brand);color:#fff;padding:22px 24px 20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.stand-top::after{content:"";position:absolute;right:-20px;top:16px;width:46%;height:46px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,transparent 1px 10px);pointer-events:none}
.stand-top .eyebrow{color:var(--sun)}
.stand-top .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem;color:#E6D9F4;position:relative}
.stand-top h2{font-size:clamp(1.25rem,2.6vw,1.7rem);color:#fff;position:relative}
.stand-top .acts{display:flex;flex-wrap:wrap;gap:10px;position:relative}
.stand-top .chip{background:rgba(255,255,255,.14);color:#fff}
.stand-top .chip.c{background:var(--coral);color:var(--on-coral)}
.stand-top .chip.e{background:var(--sun);color:var(--on-sun)}
.stand-top .chip.a{background:var(--green);color:var(--on-green)}
.stand-body{padding:20px 24px 22px;display:flex;flex-direction:column;gap:14px;background:var(--surface);background-image:repeating-linear-gradient(to bottom,transparent 0 9px,color-mix(in srgb,var(--brand) 9%,transparent) 9px 10px);background-size:100% 50px;background-position:0 14px}
.measures{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ms{appearance:none;text-align:left;cursor:pointer;border-radius:16px;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .12s,border-color .15s}
.ms:hover{border-color:var(--brand-hi)}
.ms:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.ms .n{font:500 .62rem/1 var(--f-mono);color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between}
.ms b{font-family:var(--f-display);font-weight:600;font-size:1.25rem;line-height:1}
.ms small{font-size:.74rem;color:var(--muted)}
.ms.focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ms.safe{background:var(--green-soft);border-color:var(--green)}
.ms.safe small{color:var(--green-text);font-weight:600}
.ms.end::after{content:"";position:absolute;right:8px;top:12px;bottom:12px;width:5px;border-left:1.5px solid var(--brand);border-right:3px solid var(--brand);opacity:.5}
.stand-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;font-size:.85rem}
.ladder-mini{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.ladder-mini i{width:22px;height:8px;border-radius:5px;background:var(--line)}
.ladder-mini i.on{background:var(--coral)}

/* Pendientes compactos */
.todo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.td{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);min-width:0;transition:transform .12s}
.td:hover{transform:translateY(-2px)}
.td .pi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.td .pi.ok{background:var(--green);color:var(--on-green)}
.td .pi.warn{background:var(--coral);color:var(--on-coral)}
.td .pi.wait{background:var(--sun);color:var(--on-sun)}
.td b{display:block;font-weight:600;font-size:.88rem;line-height:1.25}
.td small{color:var(--muted);font-size:.76rem}
.pend{display:flex;flex-direction:column;gap:8px}
.pend a,.pend div.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;text-decoration:none;color:var(--ink);background:var(--surface-2)}
.pend .pi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--muted)}
.pend .pi.ok{background:var(--green);color:var(--on-green)}.pend .pi.warn{background:var(--coral);color:var(--on-coral)}.pend .pi.wait{background:var(--sun);color:var(--on-sun)}
.pend b{font-weight:600;display:block;font-size:.92rem}
.pend small{color:var(--muted);font-size:.8rem}

/* Cajón de obras */
.drawer{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden}
.drawer>button{appearance:none;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px}
.drawer>button:focus-visible{outline:2px solid var(--brand-hi);outline-offset:-2px}
.drawer .pills{display:flex;flex-wrap:wrap;gap:6px}
.drawer .pills span{font:500 .66rem/1 var(--f-mono);padding:6px 9px;border-radius:999px;background:var(--surface-2)}
.drawer .pills b{color:var(--brand-text)}
.drawer .chev{transition:transform .25s}
.drawer.open .chev{transform:rotate(90deg)}
.drawer-body{padding:0 22px 22px}
.obras-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ob{border-radius:18px;overflow:hidden;background:var(--surface-2);color:var(--ink);display:flex;flex-direction:column;min-width:0}
.ob .band{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 .72rem/1.1 var(--f-body)}
.ob .band .mono{font-size:.62rem;opacity:.85}
.ob .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.ob h4{overflow-wrap:anywhere}
.ob .by{font-size:.8rem;color:var(--muted)}
.ob .foot{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.ob .foot button{appearance:none;border:0;background:transparent;color:var(--brand-text);font:600 .78rem/1 var(--f-body);cursor:pointer;padding:4px 0}
.ob .foot button:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.ob.on{box-shadow:0 0 0 2px var(--brand)}
.stepdots{display:flex;gap:4px}
.stepdots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stepdots i.on{background:var(--brand)}
.b0{background:#DCD5E4;color:#3D3546}.b1{background:var(--sun);color:var(--on-sun)}.b2{background:var(--coral);color:var(--on-coral)}.b3{background:var(--brand);color:#fff}.b4{background:var(--brand-deep);color:#fff}.b5{background:var(--green);color:var(--on-green)}

/* Consola de práctica (mini reproductor fijo) */
.console{position:fixed;left:var(--rail);right:0;bottom:0;z-index:35;background:var(--console);color:#F3EEF6;display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr);gap:16px;align-items:center;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 22px;min-height:var(--console-h)}
.console[hidden]{display:none!important}
.console .now{display:flex;align-items:center;gap:12px;min-width:0}
.console .play{appearance:none;width:46px;height:46px;border-radius:999px;border:0;background:var(--sun);color:var(--on-sun);display:grid;place-items:center;cursor:pointer;flex:none}
.console .play:focus-visible,.console button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.console .now .t{min-width:0;display:flex;flex-direction:column;gap:3px}
.console .now .t span{font:500 .58rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#C9B8DE}
.console .now .t b{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.console select{background:rgba(255,255,255,.08);color:#fff;border:0;border-radius:9px;padding:4px 8px;font:500 .72rem/1.2 var(--f-body);width:auto;max-width:100%}
.console select option{color:#241E2B;background:#fff}
.metro{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:999px;padding:6px 8px}
.metro button{appearance:none;border:0;width:28px;height:28px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font:600 .9rem/1 var(--f-body)}
.metro .bpm{font:500 .8rem/1 var(--f-mono);min-width:66px;text-align:center}
.metro .tog{width:auto;padding:0 12px;font:600 .68rem/1 var(--f-mono);letter-spacing:.06em}
.metro .tog[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.metro svg{width:20px;height:20px;color:#C9B8DE}
.metro .arm{transform-origin:12px 19px}
.metro.on .arm{animation:swing var(--beat,.79s) ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.console .right{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.console .clock{font:500 1.15rem/1 var(--f-mono)}
.console .clock small{font-size:.7rem;color:#C9B8DE}
.console .clock.run{color:var(--sun)}
.console .save{appearance:none;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:999px;padding:9px 14px;font:600 .78rem/1 var(--f-body);cursor:pointer}
.console .save:disabled{opacity:.4;cursor:not-allowed}
.console .ev{appearance:none;border:0;background:var(--coral);color:var(--on-coral);border-radius:999px;padding:10px 14px;font:600 .78rem/1 var(--f-body);cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}

/* Progreso */
.prog{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.bignum{font:600 2.4rem/1 var(--f-display);letter-spacing:-.04em;color:var(--brand-text)}
.bignum small{font:500 .82rem/1 var(--f-body);color:var(--muted);margin-left:6px;letter-spacing:0}
.spark{display:flex;align-items:flex-end;gap:4px;height:62px}
.spark i{flex:1;background:var(--brand-soft);border-radius:5px 5px 2px 2px;min-height:4px}
.spark i.met{background:var(--brand)}
.spark i.today{background:var(--sun)}
.streakbox{display:flex;align-items:center;gap:16px;background:var(--sun);color:var(--on-sun);border-radius:var(--r-l);padding:20px}
.streakbox .n{font:700 3.2rem/1 var(--f-display);letter-spacing:-.05em;display:flex;align-items:center;gap:6px}
.streakbox .n .ic{width:30px;height:30px;color:var(--coral)}
.journey{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stop{display:flex;flex-direction:column;gap:8px;padding:14px 8px;border-radius:16px;background:var(--surface-2);min-width:0;text-align:center;align-items:center}
.stop .n{font:600 1.5rem/1 var(--f-display);color:var(--muted)}
.stop .l{font-size:.64rem;hyphens:auto;font-weight:600;line-height:1.2;color:var(--muted);overflow-wrap:anywhere}
.stop.has.c0{background:#DCD5E4}.stop.has.c0 .n,.stop.has.c0 .l{color:#3D3546}
.stop.has.c1{background:var(--sun)}.stop.has.c1 .n,.stop.has.c1 .l{color:var(--on-sun)}
.stop.has.c2{background:var(--coral)}.stop.has.c2 .n,.stop.has.c2 .l{color:var(--on-coral)}
.stop.has.c3{background:var(--brand)}.stop.has.c3 .n,.stop.has.c3 .l{color:#fff}
.stop.has.c4{background:var(--brand-deep)}.stop.has.c4 .n,.stop.has.c4 .l{color:#fff}
.stop.has.c5{background:var(--green)}.stop.has.c5 .n,.stop.has.c5 .l{color:var(--on-green)}

/* Calendario */
.cal{display:flex;flex-direction:column;gap:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-h h3{text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-dow{font:500 .58rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding-bottom:4px}
.cd{appearance:none;border:0;position:relative;height:44px;max-width:100%;border-radius:11px;background:var(--surface-2);color:var(--ink);font:500 .72rem/1 var(--f-mono);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:6px;cursor:pointer;transition:transform .12s}
.cd:hover{transform:translateY(-1px)}
.cd:focus-visible{outline:2px solid var(--brand-hi);outline-offset:1px}
.cd.out{opacity:.35}
.cd.l1{background:var(--brand-soft)}
.cd.l2{background:#B79AD3;color:#2B1840}
.cd.l3{background:var(--brand);color:#fff}
.cd.rest{background:repeating-linear-gradient(135deg,var(--sun-soft) 0 5px,transparent 5px 9px);outline:1.5px dashed var(--sun);outline-offset:-1.5px}
.cd.today{box-shadow:0 0 0 2.5px var(--coral)}
.cd.sel{box-shadow:0 0 0 2.5px var(--sun)}
.cd .marks{display:flex;gap:3px}
.cd .marks i{width:6px;height:6px;border-radius:50%}
.cd .marks .ev{background:var(--sun)}
.cd .marks .evd{background:var(--coral)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.74rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.dayinfo{background:var(--surface-2);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}

/* Logros */
.nextbadge{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;align-items:center;background:var(--brand-soft);border-radius:18px;padding:14px}
.nextbadge .medal{width:54px;height:54px;border-radius:16px;border:2px dashed var(--brand-hi);color:var(--brand-text);display:grid;place-items:center}
.nextbadge .medal .ic{width:24px;height:24px}
.minibadges{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
.mb{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mb .medal{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;border:2px dashed var(--line);color:var(--muted)}
.mb .medal .ic{width:22px;height:22px}
.mb b{font-size:.68rem;line-height:1.15;font-weight:600;color:var(--muted)}
.mb.on b{color:var(--ink)}
.mb.on .medal{border:0;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.mb.on.k0 .medal{background:var(--brand);color:#fff}.mb.on.k1 .medal{background:var(--sun);color:var(--on-sun)}.mb.on.k2 .medal{background:var(--coral);color:var(--on-coral)}.mb.on.k3 .medal{background:var(--green);color:var(--on-green)}
@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}

/* Medidor */
.meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--green);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.meter.brand i{background:var(--brand)}
.meter.sun i{background:var(--sun)}

/* Atril (tablero) */
.board-wrap{overflow-x:auto;margin-inline:-4px;padding:4px 4px 12px;scroll-snap-type:x mandatory}
.board{display:grid;grid-template-columns:repeat(6,minmax(236px,1fr));gap:14px;min-width:min-content}
.bcol{border-radius:var(--r-l);padding:12px;display:flex;flex-direction:column;gap:10px;scroll-snap-align:start;min-height:260px;background:var(--surface-2)}
.bcol-h{display:flex;flex-direction:column;gap:6px;padding:12px 12px 14px;border-radius:16px;margin:-2px -2px 4px}
.bcol-h .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bcol-h h4{font-size:.86rem}
.bcol-h .num{white-space:nowrap;flex:none;font:500 .66rem/1 var(--f-mono);background:rgba(255,255,255,.4);border-radius:999px;padding:5px 9px}
.bcol-h small{font-size:.74rem;line-height:1.3;opacity:.85}
.col-0 .bcol-h{background:#DCD5E4;color:#3D3546}.col-1 .bcol-h{background:var(--sun);color:var(--on-sun)}.col-2 .bcol-h{background:var(--coral);color:var(--on-coral)}.col-3 .bcol-h{background:var(--brand);color:#fff}.col-4 .bcol-h{background:var(--brand-deep);color:#fff}.col-5 .bcol-h{background:var(--green);color:var(--on-green)}
.col-3 .bcol-h .num,.col-4 .bcol-h .num{background:rgba(255,255,255,.18)}
.bcol .empty-col{font-size:.8rem;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r-m);padding:16px;text-align:center}
.oc{background:var(--surface);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;text-align:left;color:var(--ink)}
.oc:hover{transform:translateY(-3px)}
.oc:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.oc h4{font-size:.95rem;overflow-wrap:anywhere}
.oc .by{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.oc .foot{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.oc .meta{display:flex;flex-wrap:wrap;gap:6px}
.oc .progline{display:flex;flex-direction:column;gap:5px;font-size:.74rem;color:var(--muted)}
.difdots{display:flex;gap:4px}
.difdots i{width:8px;height:8px;border-radius:50%}
.difdots .a{background:var(--green)}.difdots .e{background:var(--sun)}.difdots .c{background:var(--coral)}

/* Estudiar */
.study{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.timer{background:var(--brand);color:#fff;border-radius:var(--r-l);padding:24px;display:flex;flex-direction:column;gap:18px}
.timer .eyebrow{color:var(--sun)}
.timer .clock{font:500 clamp(3rem,8vw,4.8rem)/1 var(--f-mono);letter-spacing:-.06em}
.timer .clock.run{color:var(--sun)}
.timer .blocks{display:flex;flex-wrap:wrap;gap:8px}
.timer .blk{appearance:none;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;cursor:pointer;font:inherit;min-width:128px;text-align:left}
.timer .blk b{font-size:.8rem;font-weight:600}
.timer .blk small{font:500 .62rem/1 var(--f-mono);opacity:.8}
.timer .blk .meter{width:100%;height:4px;background:rgba(255,255,255,.18)}
.timer .blk[aria-pressed="true"]{background:var(--ivory);color:var(--brand)}
.timer .blk:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.timer .acts{display:flex;flex-wrap:wrap;gap:10px}
.timer .btn{border-color:rgba(255,255,255,.35);background:transparent;color:#fff}
.timer .btn:hover{border-color:#fff}
.timer .btn.go{background:var(--sun);border-color:var(--sun);color:var(--on-sun)}
.timer .work{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:rgba(0,0,0,.16);border-radius:var(--r-m);padding:14px}
.timer .work label.f{color:rgba(255,255,255,.8)}
.timer .work .s2w{grid-column:1/-1}
.timer select,.timer input{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.timer select option{color:#241E2B;background:#fff}
.timer input::placeholder{color:rgba(255,255,255,.55)}
.timer .sugs{display:flex;flex-wrap:wrap;gap:6px}
.timer .sugs button{appearance:none;border:1px dashed rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:6px 10px;font:500 .74rem/1.2 var(--f-body);cursor:pointer}
.timer .sugs button:hover{border-color:var(--sun);color:var(--sun)}
.rlist{display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 38px;gap:10px;align-items:center}
.rrow.ro{grid-template-columns:auto minmax(0,1fr) auto;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.rrow.ro .sw{width:12px;height:12px;border-radius:4px}
.rrow .pct{font:500 .66rem/1 var(--f-mono);color:var(--muted)}
.status-banner{border-radius:var(--r-m);padding:12px 14px;font-size:.88rem;display:flex;gap:10px;align-items:flex-start}
.status-banner.ok{background:var(--green-soft);color:var(--green-text)}
.status-banner.wait{background:var(--sun-soft);color:var(--sun-text)}
.status-banner.warn{background:var(--coral-soft);color:var(--coral-text)}
.status-banner.info{background:var(--brand-soft);color:var(--brand-text)}
.status-banner b{font-weight:700}
.log{display:flex;flex-direction:column;gap:6px}
.log div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:.88rem}
.log .mono{color:var(--brand-text);font-size:.78rem}

/* Evidencias */
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.step3{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:var(--r-l)}
.step3:nth-child(1){background:var(--coral);color:var(--on-coral)}
.step3:nth-child(2){background:var(--sun);color:var(--on-sun)}
.step3:nth-child(3){background:var(--green);color:var(--on-green)}
.step3 .k{font:700 1.7rem/1 var(--f-display)}
.step3 .hint{color:inherit;opacity:.85}
.evlist{display:flex;flex-direction:column;gap:14px}
.ev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;padding:18px;border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow)}
.ev .who{display:flex;flex-direction:column;gap:6px;min-width:0}
.ev .who a{overflow-wrap:anywhere;font-weight:600}
.ev .fb{background:var(--brand-soft);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ev .fb.none{background:var(--surface-2);color:var(--muted);font-size:.88rem}
.ev .fb p{white-space:pre-wrap;overflow-wrap:anywhere}

/* Método */
.metodo-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:24px;display:flex;flex-direction:column;gap:4px;background:var(--surface);border-radius:var(--r-l);padding:10px;box-shadow:var(--shadow)}
.toc a{padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.86rem}
.toc a:hover{background:var(--brand-soft);color:var(--brand-text)}
.msecs{display:flex;flex-direction:column;gap:18px}
.msec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:90px;background:var(--surface);border-radius:var(--r-l);padding:24px;box-shadow:var(--shadow)}
.msec p,.msec li{max-width:68ch}
.msec ol,.msec ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.tablewrap{overflow-x:auto;border-radius:var(--r-m);background:var(--surface-2)}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:520px}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;background:var(--brand);color:#fff;font:500 .62rem/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.ladder{display:flex;flex-direction:column;gap:4px;padding:0;margin:0;counter-reset:l}
.ladder li{list-style:none;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:6px 0;align-items:start;counter-increment:l}
.ladder li::before{content:counter(l);width:30px;height:30px;border-radius:10px;background:var(--coral);color:var(--on-coral);display:grid;place-items:center;font:600 .8rem/1 var(--f-display)}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(30,18,44,.6);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:fade .18s ease}
.modal{background:var(--bg);border-radius:var(--r-l);width:min(880px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:rise .22s cubic-bezier(.2,.9,.3,1)}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 16px;background:var(--brand);color:#fff}
.modal-h .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.modal-h .eyebrow{color:var(--sun)}
.modal-h .muted{color:#E3D5F2}
.modal-h h2{overflow-wrap:anywhere;color:#fff}
.modal-h .icon-btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{appearance:none;border:0;background:var(--surface-2);padding:9px 13px;border-radius:999px;font:600 .8rem/1 var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--brand);color:#fff}
.tabs button:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.tabs .cur{width:7px;height:7px;border-radius:50%;background:var(--sun)}
.modal-b{padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.modal-f{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.guide{background:var(--brand-soft);color:var(--ink);border-radius:var(--r-m);padding:14px 16px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.guide b{color:var(--brand-text)}
.guide ul{margin:0;padding-left:1.1em}
.harm{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.harm label{display:flex;flex-direction:column;gap:3px;font:500 .6rem/1 var(--f-mono);color:var(--muted)}
.harm label.rep input{background:var(--green-soft);border-style:dashed}
.harm input{padding:7px 8px;font-size:.85rem}
.rows{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:70px 70px minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) 38px;gap:8px;align-items:end;padding:12px;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow)}
.frow.crit{box-shadow:0 0 0 2px var(--coral)}
.frow .full{grid-column:1/-1}
.mrow{display:grid;grid-template-columns:64px 70px 70px minmax(0,1fr) minmax(0,1.4fr) 38px;gap:8px;align-items:end;padding:10px;border-radius:var(--r-m);background:var(--surface)}
.lad{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lad button{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;width:32px;height:32px;font:600 .78rem/1 var(--f-display);cursor:pointer}
.lad button.on{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.lad button:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.lad .lbl{font-size:.8rem;color:var(--ink);margin-left:6px}
.summary{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.summary .k{display:flex;flex-direction:column;gap:4px;background:var(--surface);border-radius:var(--r-m);padding:12px 16px;box-shadow:var(--shadow)}
.summary .k b{font:600 1.5rem/1 var(--f-display);letter-spacing:-.03em}
.summary .k small{font-size:.74rem;color:var(--muted)}
.chal{border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);box-shadow:var(--shadow)}
.chal.focus{box-shadow:0 0 0 2px var(--brand-hi),var(--shadow)}
.chal .h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chal ul{margin:0;padding-left:1.1em;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.inline-confirm{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--coral-text);font-weight:600;flex-wrap:wrap}

/* Profesora */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stat{border-radius:var(--r-l);padding:20px;display:flex;flex-direction:column;gap:6px}
.stat b{font:600 2.2rem/1 var(--f-display);letter-spacing:-.04em}
.stat small{font-size:.84rem;font-weight:600}
.stat.a{background:var(--brand);color:#fff}.stat.b{background:var(--coral);color:var(--on-coral)}.stat.c{background:var(--sun);color:var(--on-sun)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.consist{overflow-x:auto}
.consist table{min-width:560px}
.consist td.sq{padding:6px 2px;text-align:center}
.consist td.sq i{display:inline-block;width:16px;height:16px;border-radius:5px;background:var(--surface)}
.consist td.sq i.l1{background:var(--brand-soft)}.consist td.sq i.l3{background:var(--brand)}
.consist td.sq i.rest{background:transparent;outline:1.5px dashed var(--sun);outline-offset:-2px}
.rank{display:flex;flex-direction:column;gap:6px}
.rank div{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.rank .pos{font:600 1.1rem/1 var(--f-display);color:var(--muted);text-align:center}
.rank div.first{background:var(--sun);color:var(--on-sun)}
.rank div.first .pos,.rank div.first small{color:var(--on-sun)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.person{appearance:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:var(--surface);border:0;border-radius:var(--r-l);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:transform .15s}
.person:hover{transform:translateY(-2px)}
.person:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.person .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font:600 1rem/1 var(--f-display)}
.person .nums{display:flex;gap:18px;flex-wrap:wrap}
.person .nums div{display:flex;flex-direction:column}
.person .nums b{font:600 1.1rem/1.1 var(--f-display)}
.person .nums small{font-size:.72rem;color:var(--muted)}
.subnav{display:flex;gap:6px;flex-wrap:wrap}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{appearance:none;font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-m);border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.alert:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}

/* Estados */
.state{max-width:560px;margin:56px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.state .art{width:88px;height:88px;border-radius:28px;background:var(--brand);color:#fff;display:grid;place-items:center}
.state .art .ic{width:40px;height:40px}
.skel{border-radius:var(--r-l);background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.onb{max-width:640px;margin:20px auto 0}
.toast{position:fixed;left:50%;bottom:calc(var(--console-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--carbon);color:var(--ivory);padding:12px 18px;border-radius:999px;font-weight:600;font-size:.88rem;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast.bad{background:var(--coral);color:var(--on-coral)}
.toast.good .ic{color:var(--green)}
.demo-banner{display:flex;gap:10px;align-items:center;background:var(--sun-soft);color:var(--sun-text);border-radius:var(--r-m);padding:10px 14px;font-size:.84rem}
.demo-banner span{flex:1;min-width:0}
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.celebrate i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 1.6s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}

@media (max-width:1000px){
  .prog,.study,.grid2,.metodo-grid{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
  .todo{grid-template-columns:minmax(0,1fr)}
  .console{grid-template-columns:minmax(0,1fr) auto}
  .console .metro{display:none}
}
@media (max-width:760px){
  :root{--console-h:70px}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .appbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .appbar .mark{flex-direction:row;gap:10px}
  .appbar .mark .sq{width:38px;height:38px;border-radius:12px;font-size:.9rem}
  .appbar .mark small{font-size:.7rem}
  .appbar .forkb{width:36px;height:36px;padding:0!important;display:grid;place-items:center;color:var(--ink)}
  .appbar .modeb,.appbar .forkb{white-space:nowrap;appearance:none;border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 12px;font:600 .72rem/1 var(--f-body);cursor:pointer;box-shadow:var(--shadow)}
  main{padding:8px max(16px,env(safe-area-inset-right,0px)) calc(var(--console-h) + 96px) max(16px,env(safe-area-inset-left,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:36;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around;gap:2px}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:14px;text-decoration:none;color:var(--muted);font:600 .62rem/1 var(--f-body);position:relative}
  .tabbar a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-text)}
  .tabbar .dot-badge{position:absolute;top:2px;right:calc(50% - 24px);min-width:16px;height:16px;line-height:16px;font-size:.56rem;padding:0 4px}
  .console{left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom,0px));border-radius:20px;padding:8px 10px 8px 8px;gap:10px;min-height:0}
  .console .ev{display:none}
  .console .save{padding:8px 11px}
  .console .clock small{display:none}
  .console .play{width:42px;height:42px}
  .console .clock{font-size:.95rem}
  .toast{bottom:calc(var(--console-h) + 90px + env(safe-area-inset-bottom,0px))}
  .week{grid-template-columns:minmax(0,1fr)}
  .keys{justify-content:space-between}
  .key{width:auto;flex:1;height:86px}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .s3,.s4{grid-column:1/-1}.s2{grid-column:span 1}
  .stand-top,.stand-body{padding-left:18px;padding-right:18px}
  .measures{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps3,.stats{grid-template-columns:minmax(0,1fr)}
  .ev{grid-template-columns:minmax(0,1fr)}
  .journey{grid-template-columns:repeat(3,minmax(0,1fr))}
  .frow{grid-template-columns:1fr 1fr 38px}
  .frow>*:nth-child(n+3):not(.rm){grid-column:1/-1}
  .frow .rm{grid-column:3;grid-row:1}
  .mrow{grid-template-columns:52px 1fr 1fr 38px}
  .mrow .tp,.mrow .nt{grid-column:1/-1}
  .mrow .rm{grid-column:4;grid-row:1}
  .timer .work{grid-template-columns:minmax(0,1fr)}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{border-radius:var(--r-l) var(--r-l) 0 0;max-height:94%}
  .modal-b{padding:18px 16px}
  .modal-h,.modal-f,.tabs{padding-left:16px;padding-right:16px}
  .modal-f{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .drawer>button,.drawer-body{padding-left:16px;padding-right:16px}
}

/* ═════════════ Capa de diseño «Coro» ═════════════
   Va al final para ganar a las reglas de la v5 sin tocar el HTML ni el JavaScript. */

/* Base y tipografía */
body{font:400 15px/1.5 var(--f-body);background:var(--fondo);color:var(--tinta)}
:focus-visible{outline:2px solid var(--acento)!important;outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-body);text-wrap:balance}
h1{font-size:clamp(24px,2.6vw,30px);font-weight:800;letter-spacing:-.5px;line-height:1.15}
h2{font-size:18px;font-weight:800;letter-spacing:-.2px;line-height:1.25}
h3{font-size:15px;font-weight:700;letter-spacing:0}
h4{font-size:14px;font-weight:700;letter-spacing:0}
.eyebrow{font:800 11px/1.3 var(--f-body);letter-spacing:.8px;text-transform:uppercase;color:var(--suave)}
.page-head .eyebrow,.hello .eyebrow{font:600 13px/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--suave);opacity:1}
.mono{font-family:var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:0;font-weight:700}
.ic{stroke-width:2}
.hint{font-size:13px}
.muted{color:var(--suave)}

/* Menú lateral oscuro (computadora) */
.rail{background:var(--tinta);color:#fff;border-right:0;align-items:stretch;gap:20px;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 20px max(16px,env(safe-area-inset-left,0px))}
.rail .mark{flex-direction:row;gap:12px;color:#fff;padding:0 8px}
.mark .sq{width:40px;height:40px;border-radius:12px;background:var(--acento);font:800 18px/1 var(--f-body)}
.mark .sq::before{color:#fff;border-bottom-color:rgba(255,255,255,.7);font:italic 700 7px/1 var(--f-body)}
.mark small{font:800 17px/1 var(--f-body);letter-spacing:.2px;text-transform:none}
.rail .mark small{color:#fff}
.side-nav{gap:4px}
.side-nav a{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px;border-radius:10px;color:#C9D0DC;font:600 14px/1.2 var(--f-body);text-align:left;min-height:var(--toque)}
.side-nav a .ic{width:20px;height:20px}
.side-nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side-nav a[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.side-nav .dot-badge{position:static;margin-left:auto}
.dot-badge{background:var(--rojo);color:#fff;font:700 11px/18px var(--f-body);min-width:20px;height:20px;line-height:20px;border-radius:10px}
.side-foot{align-items:stretch;gap:12px}
.fork{flex-direction:row;justify-content:flex-start;gap:10px;padding:0 12px;min-height:var(--toque);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font:600 14px/1 var(--f-body)}
.fork:hover{background:rgba(255,255,255,.12);color:#fff}
.mode small{font:800 11px/1.2 var(--f-body);letter-spacing:.8px;color:#A9B2C2;text-align:left;padding-left:4px}
.mode .seg{flex-direction:row;background:rgba(255,255,255,.08);border-radius:12px;padding:4px;gap:4px}
.mode .seg button{flex:1;height:36px;border-radius:9px;color:#C9D0DC;font:600 13px/1 var(--f-body)}
.mode .seg button[aria-pressed="true"]{background:#fff;color:var(--tinta);font-weight:700;box-shadow:0 1px 2px rgba(24,32,46,.12)}
.mode .del{color:#F3A9A7;font:600 12px/1.2 var(--f-body);text-align:left;padding:4px}
.me{flex-direction:row;gap:10px;padding:8px 4px 0;border-top:1px solid rgba(255,255,255,.12)}
.me .av{width:36px;height:36px;border-radius:50%;background:var(--acento-suave);color:var(--acento-oscuro);font:800 14px/1 var(--f-body)}
.me b{font-size:14px;max-width:150px;color:#fff}

/* Encabezados de página: antetítulo gris + título grande, sin franja de color */
main{padding-top:28px}
.page{gap:16px}
.page-head[class*="ph-"]{background:transparent!important;color:var(--tinta)!important;padding:0;border-radius:0;overflow:visible}
.page-head[class*="ph-"]::after{display:none}
.page-head[class*="ph-"] h1{color:var(--tinta)}
.page-head[class*="ph-"] .muted{color:var(--suave);opacity:1}
.page-head[class*="ph-"] .btn:not(.btn-primary){background:#fff;border:1px solid var(--linea-campo);color:var(--tinta)}
.page-head[class*="ph-"] .btn-ghost{background:transparent!important;border-color:transparent!important;color:var(--tinta)!important;padding-left:0}
.page-head[class*="ph-"] .btn-primary{background:var(--acento);color:#fff}
.page-head .person{background:#fff}

/* Botones */
.btn{min-height:var(--toque);padding:0 16px;border-radius:12px;border:1px solid var(--linea-campo);background:#fff;color:var(--tinta);font:700 14px/1 var(--f-body);gap:6px}
.btn:hover{border-color:var(--suave)}
.btn:active{transform:none}
.btn-primary{background:var(--acento);border-color:var(--acento);color:#fff}
.btn-primary:hover{background:var(--acento-oscuro);border-color:var(--acento-oscuro)}
.btn-coral{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn-coral:hover{border-color:var(--rojo);filter:brightness(.92)}
.btn-sun{background:#fff;border-color:#fff;color:var(--tinta)}
.btn-sun:hover{border-color:#fff;background:var(--acento-suave)}
.btn-glass{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.btn-glass:hover{border-color:#fff;background:rgba(255,255,255,.08)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--suave);padding:0 10px}
.btn-ghost:hover{background:var(--gris-claro);color:var(--tinta);border-color:transparent}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.icon-btn{width:var(--toque);height:var(--toque);border-radius:12px;border:1px solid var(--linea-campo)}
.icon-btn:hover{border-color:var(--suave)}

/* Campos */
label.f{font:700 13px/1.3 var(--f-body);color:var(--tinta);gap:6px}
input,select,textarea{border:1px solid var(--linea-campo);border-radius:12px;font-size:15px;background:#fff;color:var(--tinta)}
input:not([type=checkbox]):not([type=radio]),select{min-height:48px;padding:0 14px}
textarea{padding:10px 12px;font-size:14px;resize:none}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--acento);box-shadow:none;outline:2px solid var(--acento)!important;outline-offset:0}
input[type="checkbox"]{width:22px;height:22px;accent-color:var(--acento)}
.fgrid{gap:12px}
.err{color:var(--rojo);font-size:13px;font-weight:600}

/* Chips y pills */
.chip{font:700 12px/1.2 var(--f-body);padding:3px 8px;border-radius:8px;background:var(--gris-claro);color:var(--tinta)}
.chip.brand{background:var(--acento-suave);color:var(--acento)}
.chip.sun{background:var(--meta-suave);color:var(--meta)}
.chip.coral{background:var(--aviso-suave);color:var(--aviso)}
.chip.green{background:var(--exito-suave);color:var(--exito-oscuro)}
button.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--linea-campo);background:#fff;color:var(--tinta);font:600 13px/1 var(--f-body)}
button.chip:hover{background:var(--acento-suave);color:var(--acento-oscuro)}
button.chip[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:#fff;font-weight:700}

/* Tarjetas */
.card{border-radius:18px;padding:20px;gap:14px;box-shadow:none}
.status-banner{border-radius:16px;font-size:14px}
.status-banner.wait{background:var(--meta-suave);color:#4A3600}
.guide{border-radius:16px;font-size:14px;background:var(--acento-suave);color:var(--tinta)}
.guide b{color:var(--acento-oscuro)}
.demo-banner{border-radius:16px;background:var(--meta-suave);color:#4A3600;font-size:13px;font-weight:600}
.sec-h h3 .ic{color:var(--acento)}

/* Hoy: pastillas de estado */
.sp{border-radius:14px;padding:8px 14px 8px 8px;font-size:13px;font-weight:600;color:var(--suave)}
.sp .dot{border-radius:10px}
.sp b{font:800 15px/1 var(--f-body);color:var(--tinta);font-variant-numeric:tabular-nums}
.sp .bar{background:var(--gris-claro)}
.sp .bar i{background:var(--acento)}

/* Teclado de la semana (las teclas siguen sonando; colores del kit) */
.week .txt b{font:800 18px/1.2 var(--f-body)}
.key{border:1px solid var(--linea-campo);border-radius:6px 6px 12px 12px;color:var(--suave);font:700 12px/1 var(--f-body)}
.key .mk{border-radius:50%}
.key.met{background:var(--acento);border-color:var(--acento);color:#fff}
.key.met .mk{background:#fff;color:var(--acento)}
.key.miss{background:var(--aviso-suave);border-color:var(--aviso-suave);color:var(--aviso)}
.key.today{border:2px solid var(--acento);color:var(--acento)}
.key.today::before{color:var(--acento);font:800 10px/1 var(--f-body);letter-spacing:.8px}
.key.rest{background:var(--tinta);border-color:var(--tinta);color:#fff}
.key.rest .mk{color:#fff}
.key.sel{box-shadow:0 0 0 3px var(--acento-suave)}
.keyinfo{font-size:13px}

/* Atril (tarjeta destacada) */
.stand{border-radius:18px}
.stand-top{background:var(--acento);padding:18px 20px;gap:10px}
.stand-top::after{background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 1px,transparent 1px 10px)}
.stand-top .eyebrow{color:#fff;opacity:.85;font-size:12px;letter-spacing:1px}
.stand-top .meta{color:rgba(255,255,255,.9);font-size:13px}
.stand-top h2{font-size:clamp(20px,2.4vw,26px);font-weight:800;letter-spacing:-.4px}
.stand-top .chip{background:rgba(255,255,255,.16);color:#fff}
.stand-top .chip.a{background:var(--exito-suave);color:var(--exito-oscuro)}
.stand-top .chip.e{background:var(--meta-suave);color:var(--meta)}
.stand-top .chip.c{background:var(--cat1-f);color:var(--cat1-t)}
.stand-body{padding:18px 20px 20px;background-image:repeating-linear-gradient(to bottom,transparent 0 9px,var(--gris-claro) 9px 10px)}
.ms{border:1px solid var(--linea-campo);border-radius:14px}
.ms:hover{border-color:var(--acento)}
.ms .n{font:800 10px/1 var(--f-body);letter-spacing:.8px}
.ms b{font:800 22px/1 var(--f-body);font-variant-numeric:tabular-nums}
.ms small{font-size:12px}
.ms.focus{border:2px solid var(--acento);box-shadow:none;background:var(--acento-suave)}
.ms.safe{background:var(--exito-suave);border-color:var(--exito)}
.ms.end::after{border-color:var(--acento)}
.stand-foot{border-top-color:var(--linea)}
.ladder-mini i{background:var(--gris-claro)}
.ladder-mini i.on{background:var(--acento)}

/* Pendientes */
.td{border-radius:14px}
.td:hover{transform:none;outline:1px solid var(--linea-campo)}
.td .pi,.pend .pi{border-radius:12px}
.td .pi.ok,.pend .pi.ok{background:var(--exito-suave);color:var(--exito-oscuro)}
.td .pi.warn,.pend .pi.warn{background:var(--aviso-suave);color:var(--aviso)}
.td .pi.wait,.pend .pi.wait{background:var(--meta-suave);color:var(--meta)}
.td b{font-weight:700;font-size:14px}
.td small{font-size:12px}

/* Cajón de obras */
.drawer{border-radius:18px}
.drawer .pills span{font:700 12px/1 var(--f-body);border-radius:8px}
.ob{border-radius:14px;background:#fff;border:1px solid var(--linea)}
.ob .band{font:700 12px/1.2 var(--f-body)}
.ob.on{box-shadow:0 0 0 2px var(--acento)}
.ob .foot button{color:var(--acento);font:700 13px/1 var(--f-body);min-height:36px}
.stepdots i{background:var(--gris-claro)}
.stepdots i.on{background:var(--acento)}

/* Columnas del tablero → paleta de categorías (siempre con nombre) */
.b0,.col-0 .bcol-h,.stop.has.c0{background:var(--cat3-f);color:var(--cat3-t)}
.b1,.col-1 .bcol-h,.stop.has.c1{background:var(--cat4-f);color:var(--cat4-t)}
.b2,.col-2 .bcol-h,.stop.has.c2{background:var(--cat7-f);color:var(--cat7-t)}
.b3,.col-3 .bcol-h,.stop.has.c3{background:var(--cat2-f);color:var(--cat2-t)}
.b4,.col-4 .bcol-h,.stop.has.c4{background:var(--cat8-f);color:var(--cat8-t)}
.b5,.col-5 .bcol-h,.stop.has.c5{background:var(--cat6-f);color:var(--cat6-t)}
.stop.has.c0 .n,.stop.has.c0 .l{color:var(--cat3-t)}.stop.has.c1 .n,.stop.has.c1 .l{color:var(--cat4-t)}.stop.has.c2 .n,.stop.has.c2 .l{color:var(--cat7-t)}
.stop.has.c3 .n,.stop.has.c3 .l{color:var(--cat2-t)}.stop.has.c4 .n,.stop.has.c4 .l{color:var(--cat8-t)}.stop.has.c5 .n,.stop.has.c5 .l{color:var(--cat6-t)}
.bcol{border-radius:18px;background:var(--gris-claro)}
.bcol-h{border-radius:14px}
.bcol-h .num,.col-3 .bcol-h .num,.col-4 .bcol-h .num{background:rgba(255,255,255,.7);font:700 12px/1 var(--f-body)}
.bcol .empty-col{border:1px dashed var(--punteado);border-radius:14px;font-size:13px}
.oc{border-radius:14px}
.oc:hover{transform:none;outline:1px solid var(--linea-campo)}
.oc h4{font-size:15px}
.difdots .a{background:var(--exito)}.difdots .e{background:#C99A00}.difdots .c{background:var(--rojo)}

/* Medidores */
.meter{background:var(--gris-claro)}
.meter i{background:var(--exito)}
.meter.brand i{background:var(--acento)}
.meter.sun i{background:var(--acento)}

/* Progreso */
.bignum{font:800 40px/1 var(--f-body);letter-spacing:-1px;color:var(--tinta);font-variant-numeric:tabular-nums}
.spark i{background:var(--acento-suave)}
.spark i.met{background:var(--acento)}
.spark i.today{background:var(--tinta)}
.streakbox{background:var(--meta-suave);color:#4A3600;border-radius:18px}
.streakbox .n{font:800 48px/1 var(--f-body);letter-spacing:-1px}
.streakbox .n .ic{color:var(--aviso)}
.stop{border-radius:14px}
.stop .n{font:800 22px/1 var(--f-body)}
.stop .l{font-size:11px}

/* Calendario */
.cal-dow{font:800 11px/1 var(--f-body);letter-spacing:.8px}
.cd{border-radius:10px;font:700 12px/1 var(--f-body);background:var(--gris-claro)}
.cd:hover{transform:none}
.cd.l1{background:var(--acento-suave);color:var(--acento-oscuro)}
.cd.l2{background:#AEBBF0;color:var(--acento-oscuro)}
.cd.l3{background:var(--acento);color:#fff}
.cd.rest{background:repeating-linear-gradient(135deg,var(--meta-suave) 0 5px,transparent 5px 9px);outline:1px dashed var(--punteado)}
.cd.today{box-shadow:0 0 0 2px var(--acento)}
.cd.sel{box-shadow:0 0 0 2px var(--tinta)}
.cd .marks .ev{background:#C99A00}
.cd .marks .evd{background:var(--rojo)}
.legend{font-size:12px}
.dayinfo{border-radius:14px;font-size:14px}

/* Logros */
.nextbadge{border-radius:16px}
.nextbadge .medal,.mb .medal{border-radius:50%;border-width:1px;border-color:var(--punteado)}
.nextbadge .medal{border-color:var(--acento)}
.mb b{font-size:12px}
.mb.on.k0 .medal{background:var(--acento);color:#fff}
.mb.on.k1 .medal{background:var(--meta-suave);color:var(--meta)}
.mb.on.k2 .medal{background:var(--cat1-f);color:var(--cat1-t)}
.mb.on.k3 .medal{background:var(--exito-suave);color:var(--exito-oscuro)}

/* Estudiar: temporizador como tarjeta destacada */
.timer{background:var(--acento);border-radius:18px;padding:20px}
.timer .eyebrow{color:#fff;opacity:.85;font-size:12px;letter-spacing:1px}
.timer .clock{font:800 clamp(48px,8vw,76px)/1 var(--f-body);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.timer .clock.run{color:#fff}
.timer .blk{border-radius:12px;background:rgba(255,255,255,.12)}
.timer .blk b{font-size:13px;font-weight:700}
.timer .blk small{font:600 12px/1 var(--f-body)}
.timer .blk[aria-pressed="true"]{background:#fff;color:var(--acento-oscuro)}
.timer .btn{border-color:rgba(255,255,255,.6);background:transparent;color:#fff}
.timer .btn.go{background:#fff;border-color:#fff;color:var(--tinta)}
.timer .work{border-radius:14px;background:rgba(0,0,0,.14)}
.timer .work label.f{color:#fff}
.timer select,.timer input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35)}
.timer .sugs button{border-radius:20px;font:600 12px/1.2 var(--f-body);min-height:32px}
.timer .sugs button:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.1)}
.rrow.ro{border-radius:12px}
.rrow .pct{font:700 12px/1 var(--f-body)}
.log div{border-radius:12px;font-size:14px}
.log .mono{color:var(--acento);font-size:13px}

/* Evidencias */
.step3{border-radius:18px}
.step3:nth-child(1){background:var(--cat1-f);color:var(--cat1-t)}
.step3:nth-child(2){background:var(--cat4-f);color:var(--cat4-t)}
.step3:nth-child(3){background:var(--cat6-f);color:var(--cat6-t)}
.step3 .k{font:800 28px/1 var(--f-body)}
.ev{border-radius:18px}
.ev .fb{border-radius:14px}

/* Método */
.toc{border-radius:18px}
.toc a{border-radius:10px;font-size:14px;min-height:40px;display:flex;align-items:center}
.msec{border-radius:18px;padding:20px}
.tablewrap{border-radius:14px;background:#fff;border:1px solid var(--linea)}
table{font-size:14px}
th,td{padding:12px 8px;border-top:1px solid var(--gris-claro)}
thead th{background:transparent;color:var(--suave);font:700 12px/1.2 var(--f-body);text-transform:none;letter-spacing:0;padding:8px}
.ladder li::before{border-radius:50%;background:var(--acento-suave);color:var(--acento-oscuro);font:800 13px/1 var(--f-body)}

/* Detalle de obra (ventana) */
.modal-bg{background:rgba(24,32,46,.55)}
.modal{border-radius:18px;background:var(--fondo);box-shadow:0 24px 60px -20px rgba(24,32,46,.45)}
.modal-h{background:#fff;color:var(--tinta);padding:20px 22px 14px}
.modal-h .eyebrow{color:var(--suave)}
.modal-h .muted{color:var(--suave)}
.modal-h h2{color:var(--tinta);font-size:22px;letter-spacing:-.4px}
.modal-h .icon-btn{background:#fff;border-color:var(--linea-campo);color:var(--tinta)}
.tabs{background:#fff;gap:4px;padding:0 18px 14px;border-bottom:1px solid var(--linea)}
.tabs button{background:var(--gris-claro);border-radius:20px;min-height:40px;padding:0 14px;font:600 13px/1 var(--f-body);color:var(--suave)}
.tabs button[aria-selected="true"]{background:var(--acento);color:#fff;font-weight:700}
.tabs .cur{background:currentColor;opacity:.8}
.modal-f{background:#fff;border-top-color:var(--linea)}
.modal-h,.tabs,.modal-f,.modal-b>*{flex-shrink:0}
.tabs{overflow-y:hidden}
.modal-b .meter{min-height:8px}
.harm label{font:700 11px/1 var(--f-body)}
.harm label.rep input{background:var(--exito-suave);border-style:dashed}
.harm input{min-height:40px!important;padding:0 10px!important;font-size:14px}
.frow,.mrow{border-radius:14px;background:#fff;box-shadow:none}
.frow.crit{box-shadow:inset 4px 0 0 var(--rojo)}
.lad button{border:1px solid var(--linea-campo);border-radius:50%;width:34px;height:34px;font:700 13px/1 var(--f-body)}
.lad button.on{background:var(--acento);border-color:var(--acento);color:#fff}
.summary .k{border-radius:16px;padding:14px 18px}
.summary .k b{font:800 26px/1 var(--f-body);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.summary .k small{font-size:12px}
.chal{border-radius:14px}
.chal.focus{box-shadow:inset 0 0 0 2px var(--acento)}
.inline-confirm{color:var(--rojo)}

/* Profesora */
.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat,.stat.a,.stat.b,.stat.c{background:#fff;color:var(--tinta);border-radius:16px;padding:18px;flex-direction:column-reverse;justify-content:flex-end}
.stat b{font:800 28px/1 var(--f-body);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat.a b{color:var(--acento)}.stat.b b{color:var(--aviso)}.stat.c b{color:var(--meta)}
.stat small{font-size:13px;font-weight:600;color:var(--suave)}
.consist td.sq i{border-radius:50%;background:var(--gris-claro)}
.consist td.sq i.l1{background:var(--acento-suave)}.consist td.sq i.l3{background:var(--acento)}
.consist td.sq i.rest{outline:1px dashed var(--punteado)}
.rank div{border-radius:14px}
.rank .pos{font:800 18px/1 var(--f-body)}
.rank div.first{background:var(--meta-suave);color:#4A3600}
.people{gap:12px}
.person{border-radius:18px}
.person:hover{transform:none;outline:1px solid var(--linea-campo)}
.avatar{border-radius:50%;background:var(--acento-suave);color:var(--acento-oscuro);font:800 16px/1 var(--f-body)}
.person .nums b{font:800 18px/1.1 var(--f-body);font-variant-numeric:tabular-nums}
.person .nums small{font-size:12px}
.alert{border-radius:14px;min-height:var(--toque)}

/* Estados, aviso flotante */
.state .art{border-radius:50%;background:var(--acento-suave);color:var(--acento)}
.skel{border-radius:18px}
.toast{background:var(--tinta);color:#fff;border-radius:12px;font-size:14px;box-shadow:none}
.toast.bad{background:var(--rojo);color:#fff}
.toast.good .ic{color:#7FD4C4}

/* Componentes del kit usados por las funciones nuevas */
.etq{font:800 11px/1.3 var(--f-body);letter-spacing:.8px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.antetitulo{font:600 13px/1.3 var(--f-body);color:var(--suave)}
.vacio{color:var(--suave);font-size:14px;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 12px/1.2 var(--f-body);padding:4px 9px;border-radius:8px;background:var(--acento-suave);color:var(--acento)}
.pill.verde{background:var(--exito-suave);color:var(--exito-oscuro)}
.pill.naranja{background:var(--aviso-suave);color:var(--aviso)}
.aviso{background:var(--aviso-suave);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;color:#4A2500}
.aviso>.etq{color:var(--aviso)}
.riesgo-b{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.riesgo-b>div{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 280px}
.riesgo-b b:first-child{font-size:16px;font-weight:800}
.riesgo-b p{font-size:14px}
.aviso .meter{background:rgba(255,255,255,.7)}
.nota{background:var(--meta-suave);color:#4A3600;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.nota>.etq{color:var(--meta)}
.segmento{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--gris-claro);border-radius:12px;padding:4px;width:100%}
.segmento button{appearance:none;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--suave);font:600 13px/1 var(--f-body);cursor:pointer}
.segmento button[aria-selected="true"]{background:#fff;color:var(--tinta);font-weight:700;box-shadow:0 1px 2px rgba(24,32,46,.12)}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;list-style:none;margin:0;padding:0}
.dias li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--suave)}
.dia{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 11px/1 var(--f-body);background:var(--gris-claro);color:var(--suave);font-variant-numeric:tabular-nums}
.dia.hecho{background:var(--acento);color:#fff}
.dia.hoy{background:#fff;border:2px solid var(--acento);color:var(--acento)}
.dia.hecho.hoy{background:var(--acento);color:#fff}
.dia.desc{background:var(--tinta);color:#fff;font-size:15px}
.rs-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rs-nums div{display:flex;flex-direction:column;gap:4px;background:var(--gris-claro);border-radius:14px;padding:12px}
.rs-nums b{font:800 24px/1 var(--f-body);letter-spacing:-.5px}
.rs-nums small{font-size:12px;color:var(--suave);font-weight:600}
.rs-sec{display:flex;flex-direction:column;gap:8px}
.rs-sec>.etq{color:var(--suave)}
.rs-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.rs-bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rs-bar .meter{grid-column:1/-1;height:6px}
.rs-paso{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.rs-paso .band{font:700 11px/1 var(--f-body);padding:5px 8px;border-radius:8px;white-space:nowrap}
/* Recursos: plantillas y biblioteca */
.row-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cat{display:inline-flex;align-items:center;font:700 12px/1.2 var(--f-body);padding:4px 9px;border-radius:8px}
.cat.c2{background:var(--cat2-f);color:var(--cat2-t)}.cat.c3{background:var(--cat3-f);color:var(--cat3-t)}.cat.c4{background:var(--cat4-f);color:var(--cat4-t)}
.cat.c5{background:var(--cat5-f);color:var(--cat5-t)}.cat.c8{background:var(--cat8-f);color:var(--cat8-t)}
.libs{display:flex;flex-direction:column;gap:10px}
.lib{border:1px solid var(--linea);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lib-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lib-h>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.lib-h b{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.lib-tags{display:flex;flex-wrap:wrap;gap:6px}
.lib p{font-size:14px}
.lib-as{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--gris-claro);padding-top:10px}
.lib-as>.etq{color:var(--suave)}
.lib-as .btn-ghost{align-self:flex-start;color:var(--acento);padding-left:0}
.lib-form{border-bottom:1px solid var(--linea);padding-bottom:16px}
.empty-lib{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

.cat.c1{background:var(--cat1-f);color:var(--cat1-t)}.cat.c6{background:var(--cat6-f);color:var(--cat6-t)}.cat.c7{background:var(--cat7-f);color:var(--cat7-t)}

.login .segmento{margin:4px 0}
.clave{display:flex;gap:6px;align-items:center}
.clave input{flex:1}
.solicitudes .sols{display:flex;flex-direction:column;gap:8px}
.sol{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:10px 12px;border-radius:14px;background:var(--gris-claro)}
.sol-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:180px}
.sol-t b{font-size:15px}
.sol-link{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--linea);padding-top:12px}
.sol-link .etq{color:var(--suave)}
.sol-link code{background:var(--gris-claro);border-radius:8px;padding:8px 10px;font-size:13px;overflow-wrap:anywhere}
.dup{display:flex;flex-direction:column;gap:16px}
.dup-ops{display:flex;flex-direction:column;gap:8px}
.dup-op{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--linea);cursor:pointer}
.dup-op.on{background:var(--gris-claro);cursor:default}
.dup-op input{margin-top:1px}
.dup-op b{display:block;font-size:14px}
.dup-op small{font-size:13px;color:var(--suave)}
.dlg{width:min(460px,100%)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bib-tabs{max-width:420px}
.bib-tabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.bib-barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bib-vista{max-width:440px}
.bib-q{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--linea-campo);border-radius:12px;padding:0 12px;flex:1 1 260px;max-width:420px;color:var(--suave)}
.bib-q input{border:0!important;outline:none;min-height:42px!important;padding:0!important;background:transparent}
.bib-grupo{display:flex;flex-direction:column;gap:10px}
.bib-grupo h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.bib-lista{display:flex;flex-direction:column;gap:8px}
.bib-item{background:#fff;border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.bib-t{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 260px}
.bib-t b{font-size:15px}
.bib-n{font-size:13px}
.bib-acc{background:var(--fondo-2,#f4f6fb);border-radius:14px;margin:8px 0}
.bib-acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700}
.bib-acc>summary::-webkit-details-marker{display:none}
.bib-acc>summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none;opacity:.6}
.bib-acc[open]>summary::before{transform:rotate(45deg)}
.bib-acc-t{flex:none}.bib-acc-ep{flex:1;font-weight:500;font-size:12px;color:var(--muted,#667);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bib-acc>summary .chip{margin-left:auto}
.bib-acc-c{padding:0 10px 10px}
.bib-prog{background:#fff;border:1px dashed var(--acento);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.bib-prog p{font-size:12px;margin:2px 0 8px}.bib-prog .chips{display:flex;flex-wrap:wrap;gap:6px}.bib-prog .chip{text-align:left}
.bib-chips-ep{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.bib-chips-ep .chip.on{background:var(--acento);color:#fff}
.bib-pista{margin:8px 2px}
.bib-barra .btn.on{background:var(--acento-suave);color:var(--acento)}
.bib-filtros{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin:10px 0 4px}
.bib-f{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted,#667)}
.bib-f select{height:36px;border-radius:10px;border:1px solid var(--borde,#dfe3ee);padding:0 8px;font:inherit;font-size:13px;font-weight:500;color:inherit;background:#fff;max-width:200px}
.bib-filtros .chip.on,.bib-star.on,.bib-acts .icon-btn.on{color:#b7791f}
.bib-star.on svg{fill:#f6c453}
.bib-cuenta{font-size:13px;margin:4px 0 10px}
.bib-par{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bib-listas{display:flex;flex-direction:column;gap:6px;margin:8px 0}.bib-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bib-lista-nueva{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}.bib-lista-nueva .f{flex:1;min-width:180px}
.bib-flash{outline:3px solid var(--acento);outline-offset:2px;transition:outline-color .6s}
@media (max-width:560px){.bib-f{flex:1 1 45%}.bib-f select{max-width:none;width:100%}}
.bib-voz select{height:38px;border-radius:10px;border:1px solid var(--borde,#dfe3ee);padding:0 10px;font:inherit;background:#fff}
.bib-ficha{flex-basis:100%;margin-top:6px;font-size:13px}
.bib-ficha summary{cursor:pointer;color:var(--acento);font-weight:600}
.bib-ficha dl{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:4px 12px;margin:8px 0}
.bib-ficha dt{color:var(--muted,#667);font-weight:600}.bib-ficha dd{margin:0}
.bib-ficha dd.pv{color:#9a5b00}.pv-p{background:#fff3dc;color:#9a5b00}
.bib-links a{color:var(--acento)}
@media (max-width:560px){.bib-ficha dl{grid-template-columns:1fr}.bib-ficha dt{margin-top:6px}}
.bib-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bib-form h3{font-size:16px;font-weight:800}
.asegurar{background:var(--acento-suave);color:var(--tinta)}
.asegurar>.etq{color:var(--acento-oscuro)}
.side-foot .asegurar-l{color:#AEBBF0;font-weight:700}
.nombre-ed{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lapiz{appearance:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--linea-campo);background:#fff;color:var(--suave);display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none}
.lapiz:hover{color:var(--acento);border-color:var(--acento)}
.lapiz.claro{width:26px;height:26px;background:transparent;border-color:rgba(255,255,255,.3);color:#C9D0DC}
.lapiz.claro:hover{color:#fff;border-color:#fff}
.me{align-items:center}
