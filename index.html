.mi-nombre{align-self:flex-start;padding-left:0}
.dlg-b{padding:22px;display:flex;flex-direction:column;gap:12px;background:#fff}
.dlg-b .tile-ic{width:44px;height:44px;border-radius:12px;background:var(--aviso-suave);color:var(--aviso)}
.dlg-b .tile-ic.peligro{background:#FDE2E1;color:var(--rojo)}
.dlg-b h2{font-size:19px}
.al-acts{display:flex;justify-content:flex-end;margin-top:-6px}
.peligro-t{color:var(--rojo)!important}
.peligro-t:hover{background:#FDE2E1!important}
.pap-h{appearance:none;width:100%;border:0;background:transparent;font:inherit;color:var(--tinta);text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;padding:0;min-height:var(--toque)}
.pap-h .tile-ic{background:var(--gris-claro);color:var(--suave);width:36px;height:36px;border-radius:10px}
.pap-t{display:flex;flex-direction:column;gap:2px;flex:1}
.pap-t small{font-size:13px;color:var(--suave)}
.papelera .chev{transition:transform .2s}
.pap-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sol-rech summary{cursor:pointer;font-size:13px;color:var(--suave);font-weight:600}
.sol-rech .sol{margin-top:8px}
.prof-link{display:flex;justify-content:center;margin-top:12px}
.prof-form{margin-top:12px;gap:12px}
/* Acceso con correo */
.login{max-width:440px;margin-top:8vh;gap:14px}
.login-mark{flex-direction:row!important;gap:10px;align-items:center}
.login-mark small{color:var(--tinta)}
.side-foot .salir{color:#C9D0DC;text-align:left;padding:6px 4px}

/* ═════ Hoy: plan del día ═════ */
.semana-plan{display:flex;flex-direction:column;gap:10px}
.sp-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.sp-h .etq{color:var(--suave)}
.dcards{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dcard{appearance:none;position:relative;text-align:left;cursor:pointer;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:104px;color:var(--tinta);font:inherit;transition:transform .12s}
.dcard:active{transform:translateY(1px)}
.dcard .dh{font:700 13px/1.2 var(--f-body);display:flex;justify-content:space-between;align-items:center;gap:4px}
.dcard .dh em{font:800 9px/1 var(--f-body);font-style:normal;letter-spacing:.8px;text-transform:uppercase;color:var(--acento)}
.dcard .dbar{height:5px;border-radius:3px;background:var(--gris-claro);overflow:hidden;margin-top:4px}
.dcard .dbar i{display:block;height:100%;background:var(--acento);border-radius:3px}
.dcard .dn{font-size:12px;color:var(--suave);font-weight:600}
.dcard .dt{font:700 12px/1.2 var(--f-body);font-variant-numeric:tabular-nums;margin-top:auto}
.dcard .dok{position:absolute;right:8px;bottom:8px;width:20px;height:20px;border-radius:50%;background:var(--exito-suave);color:var(--exito-oscuro);display:grid;place-items:center}
.dcard .dok .ic{width:12px;height:12px}
.dcard.today{border:2px solid var(--acento);padding:9px}
.dcard.sel:not(.today){box-shadow:0 0 0 2px var(--tinta)}
.dcard.today.sel{box-shadow:0 0 0 3px var(--acento-suave)}
.dcard.rest{background:var(--tinta);border-color:var(--tinta);color:#fff;align-items:flex-start}
.dcard.rest .rst{font:400 26px/1 serif;margin:6px auto 0;align-self:center}
.dcard.rest .dt{color:#C9D0DC;font-weight:600}
.plan{gap:14px}
.plan-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 16px}
.plan-h .etq{color:var(--suave)}
.plan-h h3{font-size:18px;font-weight:800;margin-top:4px}
.tsel .chip{min-height:38px;padding:0 13px;font-variant-numeric:tabular-nums}
.totro{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--suave)}
.totro input{width:84px;min-height:38px!important;padding:0 10px!important}
.pbar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--gris-claro)}
.pbar i.cat{display:block;padding:0;border-radius:0;background:currentColor;opacity:.3;min-width:4px}
.pbar i.cat.on{opacity:1}
.plan-sum{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;font-size:13px;color:var(--suave);font-weight:600}
.plan-sum b{color:var(--tinta);font-weight:800}
.plan-sum .over,.plan-sum .over b{color:var(--aviso)}
.hreal{display:inline-flex;align-items:center;gap:8px}
.hreal input{width:150px;min-height:38px!important;padding:0 10px!important;border-style:dashed;font:700 14px/1 var(--f-body);font-variant-numeric:tabular-nums}
.hreal input:not(:placeholder-shown){border-style:solid;border-color:var(--exito);background:var(--exito-suave);color:var(--exito-oscuro)}
.pstatus{display:flex;flex-wrap:wrap;gap:8px}
.pstatus a{text-decoration:none}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) 78px 40px;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--gris-claro)}
.pcb{display:flex;padding-top:1px;cursor:pointer}
.pcb input{width:22px;height:22px;accent-color:var(--acento);margin:0;cursor:pointer}
.pmain{display:flex;flex-direction:column;gap:6px;min-width:0}
.pname{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pname b{font-size:15px;font-weight:700}
.pname small{font-size:12px;color:var(--suave);font-weight:500}
.psw{width:10px;height:10px;border-radius:3px;padding:0!important;background:currentColor!important;flex:none}
.prow.ok .pname b{text-decoration:line-through;color:var(--suave)}
.prow.ok .pline{opacity:.6}
.pchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{display:inline-flex;align-items:center;gap:5px;font:700 12px/1.2 var(--f-body);padding:4px 8px;border-radius:8px;text-decoration:none;max-width:100%}
.pchip .ic{width:13px;height:13px;flex:none}
.pchip .px{appearance:none;border:0;background:transparent;color:inherit;opacity:.6;cursor:pointer;padding:0;margin-left:2px;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px}
.pchip .px:hover{opacity:1;background:rgba(255,255,255,.5)}
.padd-b{appearance:none;width:26px;height:26px;border-radius:8px;border:1px dashed var(--punteado);background:transparent;color:var(--suave);display:inline-grid;place-items:center;cursor:pointer}
.padd-b:hover{border-color:var(--acento);color:var(--acento)}
.padd{min-height:34px!important;width:auto;max-width:100%;font-size:13px;padding:0 10px!important}
.pline{font-size:13px;color:var(--suave);line-height:1.4}
.vacio-s{font-style:italic}
.pobj{min-height:38px!important;font-size:14px!important;padding:0 10px!important;width:100%}
.pmin{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;color:var(--suave);font-weight:600}
.pmin input{width:52px;min-height:34px!important;padding:0 6px!important;text-align:right;border-color:transparent;background:transparent;font:800 15px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--tinta);-moz-appearance:textfield}
.pmin input::-webkit-inner-spin-button,.pmin input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pl-o{color:var(--tinta);font-weight:700}
.pmin input:hover{border-color:var(--linea-campo)}
.pmin.ed input{color:var(--acento);border-color:var(--acento-suave);background:var(--acento-suave)}
.pplay{appearance:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--acento);color:#fff;display:grid;place-items:center;cursor:pointer;text-decoration:none}
.pplay:hover{background:var(--acento-oscuro)}
.pplay:disabled{background:var(--gris-claro);color:var(--punteado);cursor:not-allowed}
.pdiario{display:flex;flex-direction:column;gap:8px;margin-top:6px;background:var(--gris-claro);border-radius:14px;padding:12px}
.fold{background:#fff;border-radius:18px;overflow:hidden}
.fold-h{appearance:none;width:100%;border:0;background:transparent;font:inherit;color:var(--tinta);display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;text-align:left;min-height:var(--toque)}
.fold-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.fold-t b{font-size:15px}
.fold-t small{font-size:13px;color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .chev{transition:transform .2s}
.fold.open .chev{transform:rotate(90deg)}
.fold-b{padding:0 12px 12px}
.fold-b .stand{box-shadow:none}

.pp{display:block;font-size:13px;font-weight:600;margin-top:4px}
.pp-b{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.pp-b i{font-style:normal;font:700 11px/1.2 var(--f-body);padding:3px 7px;border-radius:7px}
.pp-b i.no{background:#fff;color:var(--suave);border:1px dashed var(--punteado)}
/* Explicación de los bloques */
.expl{border:1px solid var(--linea);border-radius:14px;overflow:hidden;background:#fff}
.expl.open{border-color:var(--acento-suave);background:#FAFBFF}
.expl-h,.ex-h{appearance:none;width:100%;border:0;background:transparent;font:inherit;color:var(--tinta);text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:var(--toque)}
.expl-h .tile-ic{background:var(--acento-suave);color:var(--acento);width:34px;height:34px;border-radius:10px}
.expl-t,.ex-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.expl-t b{font-size:15px}
.expl-t small,.ex-t small{font-size:13px;color:var(--suave)}
.expl-t small b{color:var(--tinta)}
.expl .chev{transition:transform .2s;flex:none}
.expl.open>.expl-h .chev,.ex-it.on .ex-h .chev{transform:rotate(90deg)}
.expl-b{display:flex;flex-direction:column;padding:0 10px 10px}
.ex-it{border-top:1px solid var(--gris-claro)}
.ex-h{padding:10px 6px}
.ex-t b{font-size:14px}
.ex-d{padding:0 6px 12px 28px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.ex-d .etq{color:var(--suave)}
.ex-d ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pq{appearance:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--linea-campo);background:#fff;color:var(--suave);font:800 12px/1 var(--f-body);cursor:pointer;display:inline-grid;place-items:center;padding:0}
.pq:hover{border-color:var(--acento);color:var(--acento)}
/* Guía del método (Atril) */
.guia{background:#fff;border-radius:18px;overflow:hidden}
.guia-h{appearance:none;width:100%;border:0;background:transparent;font:inherit;color:var(--tinta);text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 18px;min-height:var(--toque)}
.guia-h .tile-ic{background:var(--acento-suave);color:var(--acento);width:36px;height:36px;border-radius:10px}
.guia-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.guia-t b{font-size:15px}.guia-t small{font-size:13px;color:var(--suave)}
.guia .chev{transition:transform .2s;flex:none}
.guia.open>.guia-h .chev{transform:rotate(90deg)}
.guia-b{padding:0 18px 18px;display:flex;flex-direction:column;gap:16px}
.guia-pasos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;counter-reset:none}
.gp{appearance:none;width:100%;height:100%;min-height:58px;border:0;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;cursor:pointer;font:700 12px/1.25 var(--f-body);opacity:.62;transition:opacity .15s,box-shadow .15s}
.gp .gn{font:800 15px/1 var(--f-body)}
.gp.otros{background:var(--gris-claro);color:var(--tinta)}
.gp:hover{opacity:.9}
.gp[aria-selected="true"]{opacity:1;box-shadow:0 0 0 2px var(--tinta)}
.guia-d{display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.55}
.guia-dh{display:flex;flex-direction:column;gap:4px}
.guia-dh h3{font-size:18px;font-weight:800}
.gbadge{align-self:flex-start;font:800 11px/1 var(--f-body);letter-spacing:.8px;text-transform:uppercase;padding:5px 8px;border-radius:8px}
.guia-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.guia-cols ul,.go ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.guia-cols .etq,.gbox .etq{color:var(--suave)}
.guia-side{display:flex;flex-direction:column;gap:10px}
.gbox{background:var(--gris-claro);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.guia-otros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.go{border:1px solid var(--linea);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.go-h{display:flex;align-items:center;gap:8px}.go-h b{font-size:15px}
.bcol-r{display:inline-flex;align-items:center;gap:6px}
.bq{appearance:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;background:rgba(255,255,255,.75);color:inherit;font:800 12px/1 var(--f-body);cursor:pointer;display:inline-grid;place-items:center;padding:0}
.bq:hover{background:#fff}
.bq.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.ckeys{margin-top:6px;background:#fff;color:var(--tinta);border-radius:12px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.35}
.ckeys ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ckeys li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;align-items:start}
.ckeys li .ic{width:14px;height:14px;margin-top:1px;color:var(--exito)}
.ck-foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--gris-claro);padding-top:8px}
.ck-tag{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;align-items:start;font-size:12px;color:var(--suave)}
.ck-tag .ic{width:14px;height:14px;margin-top:1px;color:var(--acento)}
.ck-tag b{color:var(--tinta)}
@media (max-width:900px){
  .guia-pasos{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:128px;overflow-x:auto;padding-bottom:4px}
  .guia-cols,.guia-otros{grid-template-columns:minmax(0,1fr)}
}
/* Cierre de la obra terminada */
.cierre-obra{border-top:1px solid var(--linea);padding-top:16px}
.cierre-obra textarea{min-height:64px}
.mtrow{display:grid;grid-template-columns:70px 70px minmax(0,1fr) 64px 38px;gap:8px;align-items:end;padding:10px;border-radius:14px;background:#fff}
@media (max-width:760px){.mtrow{grid-template-columns:1fr 1fr 1fr 38px}.mtrow .mt-q{grid-column:1/-1;grid-row:2}}

/* Modo concentración */
.concentra{position:fixed;inset:0;z-index:80;background:var(--tinta);color:#fff;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.concentra[hidden]{display:none!important}
.concentra.sin-doc{grid-template-columns:minmax(0,1fr) minmax(340px,520px)}
.focus-doc{background:#0F1520;min-height:0;display:flex}
.focus-doc iframe{border:0;width:100%;height:100%;background:#fff}
.focus-empty{margin:auto;max-width:360px;padding:24px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;color:#C9D0DC;font-size:14px}
.focus-empty .ic{width:40px;height:40px;color:#A9B2C2}
.focus-empty b{color:#fff;font-size:16px}
.focus-ctl{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.fc-top{display:flex;justify-content:space-between;align-items:center}
.fc-top .etq{color:#A9B2C2}
.fc-x{appearance:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:12px;min-height:var(--toque);padding:0 14px;font:700 14px/1 var(--f-body);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.fc-obra{display:flex;flex-direction:column;gap:6px}
.fc-obra .antetitulo{color:#A9B2C2}
.fc-obra h2{color:#fff;font-size:22px;letter-spacing:-.4px}
.fc-obra h2 span{color:#AEBBF0;font-weight:700}
.fc-obra p{color:#C9D0DC;font-size:14px}
.fc-clock{font:800 clamp(64px,9vw,104px)/1 var(--f-body);letter-spacing:-3px;font-variant-numeric:tabular-nums}
.fc-acts{display:flex;flex-wrap:wrap;gap:10px}
.fc-go{background:var(--acento);border-color:var(--acento);color:#fff;min-height:52px;padding:0 22px;font-size:15px;flex:1 1 160px}
.fc-go:hover{background:var(--acento-oscuro);border-color:var(--acento-oscuro)}
.fc-sec-btn{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.fc-sec-btn:hover{border-color:#fff}
.fc-acts .fc-sec-btn{min-height:52px;flex:1 1 160px}
.fc-metro{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(255,255,255,.07);border-radius:14px;padding:8px}
.fc-metro button{appearance:none;border:0;min-width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font:700 14px/1 var(--f-body);cursor:pointer}
.fc-metro span{flex:1;text-align:center;font:800 20px/1 var(--f-body);min-width:90px}
.fc-metro .tog{padding:0 14px}
.fc-metro .tog[aria-pressed="true"]{background:var(--acento)}
.fc-sec{display:flex;flex-direction:column;gap:10px}

/* Minutos de un día: el mayor entre el temporizador y la «Hora real» anotada al cerrar el día (nunca se suma doble) */
function dayMin(s){if(!s)return 0;return Math.max(Math.floor((s.seg||0)/60),+s.horaReal||0)}
function diasDe(ses){const d={};for(const f in ses){const m=dayMin(ses[f]);if(m)d[f]=m}return d}
function estadisticas(dias,descanso,ciclo){
  const min=minDia(ciclo),met=f=>(dias[f]||0)>=min,hoy=new Date();
  let racha=0;
  for(let i=0;i<730;i++){const d=addDays(hoy,-i),f=ymd(d);if(met(f)){racha++;continue}if(i===0||d.getDay()===descanso)continue;break}
  const mk=ymd(hoy).slice(0,7);let minMes=0;for(const f in dias)if(f.startsWith(mk))minMes+=dias[f];
  const semana=semanaEstado(dias,descanso,ciclo,monday(hoy));
  let semanasMes=0;const primero=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  for(let m=monday(primero);m<=hoy;m=addDays(m,7)){const fin=addDays(m,6);if(fin.getMonth()!==hoy.getMonth()&&fin<hoy&&fin.getMonth()!==hoy.getMonth()){}if(semanaEstado(dias,descanso,ciclo,m).cumplida)semanasMes++}
  let consecutivas=0;for(let m=addDays(monday(hoy),-7),k=0;k<60;k++,m=addDays(m,-7)){if(semanaEstado(dias,descanso,ciclo,m).cumplida)consecutivas++;else break}
  if(semana.cumplida)consecutivas++;
  let maxR=0,cur=0;const fs=Object.keys(dias).sort();
  if(fs.length){for(let d=parseD(fs[0]);d<=hoy;d=addDays(d,1)){const f=ymd(d);if(met(f)){cur++;maxR=Math.max(maxR,cur)}else if(d.getDay()!==descanso&&f!==ymd(hoy))cur=0}}
  return {racha,minMes,semana,semanasMes,consecutivas,maxRacha:Math.max(maxR,racha),min,hoyMin:dias[ymd(hoy)]||0};
}
function semanaEstado(dias,descanso,ciclo,lunes){
  const min=minDia(ciclo),hoyS=today();let cumplidos=0;const d7=[];
  for(let i=0;i<7;i++){const d=addDays(lunes,i),f=ymd(d),m=(dias[f]||0)>=min;if(m)cumplidos++;
    d7.push({f,dow:d.getDay(),met:m,rest:d.getDay()===descanso,today:f===hoyS,future:f>hoyS,min:dias[f]||0})}
  return {cumplidos,cumplida:cumplidos>=6,d7};
}
function analisisObra(o){
  const total=+o.compases||0;const rep=new Set();
  (o.mapa||[]).forEach(s=>{if(s.tipo==='igual'){const a=+s.desde,b=+s.hasta;if(a&&b&&b>=a)for(let c=a;c<=Math.min(b,total||b);c++)rep.add(c)}});
  const porAprender=Math.max(0,total-rep.size);
  let seguros=0,restante=0;const cuenta={a:0,e:0,c:0};
  (o.fragmentos||[]).forEach(f=>{const a=+f.desde,b=+f.hasta;const len=a&&b&&b>=a?b-a+1:0;cuenta[f.dif||'a']++;if(f.estado==='seguro')seguros+=len;else{seguros+=Math.min(len,(f.compSeguros||[]).length);restante+=DIF[f.dif||'a'].d}});
  const pct=porAprender?Math.min(100,Math.round(seguros/porAprender*100)):0;
  const armon=o.armonia?Object.values(o.armonia).filter(v=>String(v).trim()).length:0;
  return {total,repetidos:rep.size,rep,porAprender,seguros,pct,estimado:Math.ceil(restante),cuenta,armon};
}
function minutosObra(id,ses){let s=0;for(const f in ses)(ses[f].entradas||[]).forEach(e=>{if(e.obraId===id)s+=e.seg||0});return Math.round(s/60)}

function rutinaSemana(rutinas,ciclo){
  const wk=weekKey(new Date());
  const esta=rutinas.find(r=>r.semana===wk);

  const prev=rutinas.find(r=>r.estado==='aprobada');

  if(/already registered|already exists/i.test(m))return 'Ese correo ya tiene cuenta: usa «Entrar».';
  if(/password should be|weak|at least/i.test(m))return 'La contraseña debe tener al menos 6 caracteres.';
  if(/email not confirmed/i.test(m))return 'Falta desactivar «Confirm email» en Supabase. Avísale a tu profesora.';
  if(/signups not allowed|signup is disabled/i.test(m))return 'Por ahora no se pueden crear cuentas nuevas. Avísale a tu profesora.';
  if(/rate|too many/i.test(m))return 'Demasiados intentos. Espera un minuto e inténtalo otra vez.';
  if(/fetch|network/i.test(m))return 'Sin conexión. Revisa tu internet e inténtalo otra vez.';
  if(/invalid.*email|email.*invalid/i.test(m))return 'Ese correo no es válido.';
  return 'No se pudo: '+m}

function vInicio(){
  const p=S.perfil,st=S.st,c=+p.ciclo,R=ROMAN[c-1],min=st.min,hoy=st.hoyMin;
  const esDescanso=new Date().getDay()===+p.descanso;

  else if(esDescanso)msg='Hoy es tu día de descanso. Escuchar una versión de tu obra también cuenta como estudio.';
  else if(hoy>0)msg='Llevas '+hoy+' min. Te faltan '+(min-hoy)+' para sumar el día a tu racha.';
  else if(st.racha>0)msg='Tu racha de '+st.racha+(st.racha===1?' día':' días')+' te espera. Con '+min+' minutos hoy la mantienes.';
  else msg='Cada racha empieza con un día. Hoy pueden ser '+min+' minutos.';

  const pct=Math.min(100,Math.round(hoy/min*100));

  const asegurar=S.sb&&S.anon?'<section class="aviso asegurar"><span class="etq">'+ic('users','sm')+' Asegura tu cuenta</span><div class="riesgo-b"><div><b>Agrega tu correo y una contraseña</b><p>Hoy tu atril solo está guardado en este celular. Con correo y contraseña podrás entrar desde cualquier dispositivo y no perderás nada.</p></div><button class="btn btn-primary" data-act="asegurar-abrir">'+ic('check','sm')+' Agregar correo y contraseña</button></div></section>':'';
  const temporal=S.sb&&!S.anon&&S.perfil&&S.perfil.claveTemporal?'<section class="aviso asegurar"><span class="etq">'+ic('bolt','sm')+' Contraseña temporal</span><div class="riesgo-b"><div><b>Cambia tu contraseña</b><p>Tu profesora te dio una contraseña temporal. Elige una que solo tú conozcas.</p></div><button class="btn btn-primary" data-act="clave-cambiar">'+ic('check','sm')+' Cambiar mi contraseña</button></div></section>':'';
  return '<div class="page hoy">'+demo+temporal+asegurar+
   '<header class="hello"><div class="t"><span class="eyebrow">Hoy · '+DOW_L[hoyD.getDay()]+' '+hoyD.getDate()+' '+hoyD.toLocaleDateString('es-PE',{month:'short'}).replace('.','')+' · Ciclo '+R+'</span><h1>Tu plan del día</h1><p class="muted">'+esc(msg)+'</p></div>'+
   '<div class="stats-pills">'+
    '<span class="sp"><span class="dot" style="background:var(--coral);color:var(--on-coral)">'+ic('clock')+'</span><span class="bar"><i style="width:'+pct+'%"></i></span><b>'+hoy+'/'+min+' min</b></span>'+
    '<span class="sp" title="Mejor racha: '+st.maxRacha+'"><span class="dot" style="background:var(--sun);color:var(--on-sun)">'+ic('flame','fill')+'</span><b>'+st.racha+(st.racha===1?' día':' días')+'</b><span class="muted">racha</span></span>'+
    '<a class="sp" href="#progreso" style="text-decoration:none;color:inherit"><span class="dot" style="background:var(--brand-soft);color:var(--brand-text)">'+ic('bolt')+'</span><b>'+st.minMes+' min</b><span class="muted">este mes</span></a>'+
   '</div></header>'+
   rachaRiesgo()+semanaPlan()+planDia()+atrilPlegable()+cajonObras()+resumenLunes()+'</div>';
}

const fmtT=v=>v<60?v+' min':(v%60?(v/60).toString().replace('.',',')+' h':(v/60)+' h');
function diaSel(){const k=S.ui.key;return k&&S.st.semana.d7.some(d=>d.f===k)?k:today()}
function sesionDe(f){return S.sesiones[f]||{fecha:f,seg:0,bloques:{},entradas:[],nota:''}}
function parseHM(s){s=String(s||'').trim().toLowerCase().replace(',','.');if(!s)return null;let m;
  if((m=s.match(/^(\d+):(\d{1,2})$/)))return +m[1]*60+ +m[2];
  if((m=s.match(/^(\d+(?:\.\d+)?)\s*h(?:oras?|s)?\.?\s*(?:(\d+)\s*(?:m|min|minutos)?)?$/)))return Math.round(+m[1]*60+(+m[2]||0));
  if((m=s.match(/^(\d+)\s*(?:m|min|minutos)?$/)))return +m[1];
  return NaN}
/* Minutos sugeridos: guía según la rutina aprobada (o el reparto del método); cada bloque se puede editar */
function rutinaTotal(){const {r}=rutinaSemana(S.rutinas,+S.perfil.ciclo);return (r.bloques||[]).reduce((s,b)=>s+(+b.min||0),0)||totalRutina(+S.perfil.ciclo)}
function evSemanaDe(f){return S.evidencias.find(e=>e.semana===weekKey(parseD(f)))}
function sugeridos(T,f){
  const {r}=rutinaSemana(S.rutinas,+S.perfil.ciclo);const bl=r.bloques||[];
  const ids=['tec','est','lento','pasada','vista'];const has=ids.some(id=>bl.find(b=>b.id===id));
  const w={};ids.forEach(id=>{const b=bl.find(x=>x.id===id);w[id]=has?(b?+b.min||0:0):(BASE.find(x=>x.id===id)||{p:0}).p});
  const sum=ids.reduce((s,id)=>s+w[id],0)||1;
  const video=evSemanaDe(f)?0:5,rem=Math.max(0,T-3-video);
  const r5=x=>x<=0?0:Math.max(5,Math.round(x/5)*5);
  return {control:r5(rem*w.est/sum),calent:r5(rem*w.tec/sum/2),lectura:r5(rem*w.vista/sum),objetivo:0,lento:r5(rem*w.lento/sum),pasada:r5(rem*w.pasada/sum),reto:r5(rem*w.tec/sum/2),video,cierre:3};
}
function minsPlan(ses,f){const T=+ses.tiempoDisponible||rutinaTotal();const sg=sugeridos(T,f);const ov=ses.planMin||{};const out={};DIA.forEach(b=>{out[b.id]=ov[b.id]!=null&&ov[b.id]!==''?+ov[b.id]:sg[b.id]});return {T,sg,m:out}}
/* Qué obras van en cada bloque, según su columna del tablero (el alumno puede añadir o quitar) */
function fragActual(o){const frs=o.fragmentos||[];return frs.find(x=>x.estado==='proceso')||frs.find(x=>x.estado!=='seguro')}
function desafiosObra(o){const out=[];const pas=id=>(o.fragmentos||[]).filter(f=>f.desafio===id).map(f=>'cc. '+f.desde+'–'+f.hasta).join(', ');
  (o.focos||[]).forEach(id=>{const t=TEC.find(x=>x.id===id);if(t)out.push({n:t.n,p:pas(id)})});
  if(!out.length)(o.fragmentos||[]).filter(f=>f.desafio&&f.estado!=='seguro').forEach(f=>{const t=TEC.find(x=>x.id===f.desafio);if(t&&!out.some(x=>x.n===t.n))out.push({n:t.n,p:'cc. '+f.desde+'–'+f.hasta})});
  return out}
function mantenimiento(o){return (o.mantener||[]).filter(x=>x&&(x.desde||x.que))}
function avanzada(o){return o.col===4&&(o.fragmentos||[]).length&&(o.fragmentos||[]).every(f=>f.estado==='seguro')}
function obrasAuto(b){const O=S.obras;
  if(b==='control')return O.filter(o=>o.col===2);
  if(b==='lectura')return O.filter(o=>o.col===1);
  if(b==='lento')return O.filter(o=>o.col===3||o.col===4);
  if(b==='pasada')return O.filter(o=>avanzada(o)||(o.col===5&&(o.repaso||mantenimiento(o).length)));
  if(b==='reto')return O.filter(o=>(o.col===3||o.col===4)&&desafiosObra(o).length);
  return []}
const ROW_OBRAS=['control','lectura','lento','pasada','reto'];
function obrasDe(b,ses){const sel=(ses.planObras||{})[b];if(Array.isArray(sel))return sel.map(id=>S.obras.find(o=>o.id===id)).filter(Boolean);return obrasAuto(b)}
function principal(b,o){
  const a=analisisObra(o);
  if(b==='control'){if(!a.total)return 'Anota el total de compases en la Ficha';let c1=0;for(let i=1;i<=a.total;i++){if(!String((o.armonia||{})[i]||'').trim()&&!a.rep.has(i)){c1=i;break}}
    if(c1)return 'Armonía cc. '+c1+'–'+Math.min(a.total,c1+15)+((o.mapa||[]).length?' · marcar iguales':' · armar el mapa');return (o.mapa||[]).length?'Mapa listo · escucha 2 versiones':'Arma el mapa de secciones'}
  if(b==='lectura')return o.col===1?'Leer completa · 3 impresiones':'Lectura a primera vista';
  if(b==='lento'){if(o.col===4)return o.tempoMeta?'♩ '+(o.tempoActual||'—')+' → '+o.tempoMeta:'Define tempo actual y meta';const f=fragActual(o);
    if(!f)return (o.fragmentos||[]).length?'Todos los fragmentos seguros':'Define tus fragmentos';return 'cc. '+f.desde+'–'+f.hasta+' · '+(f.dif==='c'?'escalón '+((f.escalon||0)+1)+' de 7':f.estado==='proceso'?'manos juntas lento':'manos separadas')}
  if(b==='pasada'&&o.col===5&&!o.repaso&&mantenimiento(o).length){const m=mantenimiento(o);const tot=m.reduce((s,x)=>s+(+x.min||0),0);return 'Mantener ('+Math.min(5,tot||5)+' min): '+m.map(x=>(x.desde?'c. '+x.desde+(x.hasta?'–'+x.hasta:''):'')+(x.que?(x.desde?' · ':'')+x.que:'')).join(' / ')}
  if(b==='pasada')return (o.repaso?'Repaso · ':'')+'pasada sin parar'+(o.tempoActual?' a ♩ '+o.tempoActual:'');
  if(b==='reto'){const ds=desafiosObra(o);return ds.length?ds.map(d=>d.n+(d.p?' · '+d.p:'')).join(' / '):'Elige un desafío en Construcción'}
  return ''}

/* ───────── Resumen semanal (alumno y profesora) ───────── */
function resumenSemana(ses,obras,perfil,lunes,evid){
  const c=+perfil.ciclo||1,min=minDia(c),desc=+perfil.descanso;
  const se=semanaEstado(diasDe(ses),desc,c,lunes);
  const L=ymd(lunes),F=ymd(addDays(lunes,6));
  let total=0,sesiones=0;const porObra={};
  for(const f in ses){if(f<L||f>F)continue;const s=ses[f]||{};const dm=dayMin(s);total+=dm;if(dm)sesiones++;
    (s.entradas||[]).forEach(e=>{const k=e.obraTitulo||'Rutina';porObra[k]=(porObra[k]||0)+(e.seg||0)})}
  const top=Object.entries(porObra).map(([n,s])=>({n,min:Math.round(s/60)})).filter(x=>x.min>0).sort((a,b)=>b.min-a.min).slice(0,4);
  const pasos=[];(obras||[]).forEach(o=>(o.historial||[]).forEach((h,i)=>{if(i>0&&h.fecha>=L&&h.fecha<=F)pasos.push({t:o.titulo,col:h.col,f:h.fecha})}));
  pasos.sort((a,b)=>a.f<b.f?-1:1);
  const ev=(evid||[]).find(e=>e.semana===L);
  return {L,F,total,metaMin:min*6,min,cumplidos:se.cumplidos,cumplida:se.cumplida,d7:se.d7,top,pasos,ev,sesiones,actual:L===weekKey(new Date())};
}

function tono(freq,dur,type,vol,when){const a=audio();if(!a)return;const t=when||a.currentTime;const o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.25));o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+(dur||.25)+.02)}

  '<section class="msec" id="m-escalera"><h2>Pasajes críticos</h2><p>Polirritmia, coordinación difícil o acordes rápidos pueden tomar una semana o más. Es normal. Marca el fragmento como <b>pasaje crítico</b> y sube un escalón por sesión:</p><ol class="ladder">'+ESCALERA.map(s=>'<li><span>'+s+'</span></li>').join('')+'</ol><p class="muted">La meta del día es de proceso (“escalón 3 en c. 23–26”), no de resultado. Cada día de trabajo cuenta para tu racha.</p></section>'+
  '<section class="msec" id="m-analisis"><h2>Cómo analizar (Control sin piano)</h2><p><b>Parte 1 · Armonía.</b> Escribe el acorde de cada compás. Recordarás una progresión, no notas sueltas.</p><p><b>Parte 2 · Mapa de la obra.</b> Marca las secciones con letras (A, A’, B…) e indica si son iguales o similares. Lo que es igual no se aprende dos veces: Octavia lo descuenta de los compases por aprender.</p><div class="tablewrap"><table><thead><tr><th>Básico</th><th>Intermedio</th></tr></thead><tbody><tr><td>Tonalidad, compás, frases, secciones que se repiten, dinámicas. Acordes por nombre (Do M, Sol7).</td><td>Además: forma (binaria, ternaria, rondó, sonata), cadencias y modulaciones. Acordes por grado (I, V7, IV).</td></tr></tbody></table></div><p>Escucha dos versiones grabadas antes de sacar la obra en el piano.</p></section>'+
  '<section class="msec" id="m-tecnica"><h2>Desafíos técnicos</h2><p>En Primer bloque, marca el desafío de cada fragmento difícil. En Construcción elige 1 o 2 y trabájalos con el mismo pasaje de la obra:</p><ul>'+EJ_COMUNES.map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="tablewrap"><table><thead><tr><th>Desafío</th><th>Ejercicio con el pasaje</th><th>Material de apoyo</th></tr></thead><tbody>'+TEC.map(t=>'<tr><td><b>'+t.n+'</b></td><td>'+t.ej[0]+'</td><td>'+t.mat+'</td></tr>').join('')+'</tbody></table></div></section>'+
  '<section class="msec" id="m-rutina"><h2>La rutina por bloques</h2><p>Tú propones tu rutina cada semana y tu profesora la aprueba. El temporizador cuenta cada bloque.</p><div class="tablewrap"><table><thead><tr><th>Bloque</th><th>% del tiempo</th><th>Para qué sirve</th></tr></thead><tbody><tr><td>Calentamiento y técnica</td><td class="mono">15–20 %</td><td>Preparar las manos y construir mecanismo</td></tr><tr><td>Estudio</td><td class="mono">15–20 %</td><td>Resolver un problema técnico concreto</td></tr><tr><td>Repertorio: trabajo lento</td><td class="mono">35–40 %</td><td>Aquí se aprende de verdad</td></tr><tr><td>Repertorio: pasada completa</td><td class="mono">10–15 %</td><td>Continuidad y memoria</td></tr><tr><td>Lectura a primera vista</td><td class="mono">5–10 %</td><td>Lo más descuidado y lo más útil</td></tr><tr><td>Cierre en el diario</td><td class="mono">2–3 min</td><td>Saber por dónde empezar mañana</td></tr></tbody></table></div></section>'+
  '<section class="msec" id="m-racha"><h2>Racha y descanso</h2><p>Un día cuenta para tu racha cuando cumples el mínimo de tu ciclo: <b>30 min</b> en básico, <b>60 min</b> en intermedio y <b>90 min</b> en avanzado. Tu día de descanso es fijo y no rompe la racha. <b>6 de 7 días = semana cumplida.</b></p><p class="muted">Estudiar 6 días 40 minutos vale más que un día de 5 horas.</p></section>'+
  '<section class="msec" id="m-niveles"><h2>Básico e intermedio</h2><div class="tablewrap"><table><thead><tr><th></th><th>Básico (I–III)</th><th>Intermedio (IV–VI)</th></tr></thead><tbody><tr><td>Obras a la vez</td><td>2–3</td><td>3–4</td></tr><tr><td>Fragmentos</td><td class="mono">4–8 compases</td><td class="mono">8–16 compases</td></tr><tr><td>Análisis</td><td>Preguntas simples</td><td>Formal y armónico</td></tr><tr><td>Primer bloque</td><td>Manos separadas obligatorio</td><td>Manos juntas antes, si la lectura lo permite</td></tr><tr><td>Construcción</td><td>Objetivo sugerido por la profesora</td><td>El alumno propone su objetivo</td></tr><tr><td>Obras en Primer bloque</td><td>1 a la vez</td><td>2 a la vez</td></tr></tbody></table></div></section>'+
  '<section class="msec" id="m-grabar" style="border-bottom:0"><h2>Cómo grabar tu evidencia</h2><ol><li>Abre <a href="https://picd.in/record" target="_blank" rel="noopener">picd.in/record</a>. No necesitas cuenta.</li><li>Graba el fragmento de tu meta semanal. Máximo 5 minutos por grabación.</li><li>Copia el enlace y pégalo en Evidencias, con los compases que tocaste.</li><li>Las grabaciones se borran tras un año sin abrirse: guarda en Drive las de tus recitales.</li></ol></section>'+
  '</div></div></div>';
}

/* ───────── Profesora ───────── */
function resumenAl(a){
  const mk=today().slice(0,7);const mesOk=a.mes===mk;
  return {racha:a.racha||0,minMes:mesOk?(a.minutosMes||0):0,puntaje:mesOk?(a.puntaje||0):0,semanas:mesOk?(a.semanasMes||0):0};
}
function diasSinEstudio(a){
  const ult=a.ultimaSesion;const desc=+a.descanso;const hoy=new Date();
  const desde=ult?addDays(parseD(ult),1):(a.creado?new Date(a.creado):hoy);let n=0;
  for(let d=new Date(desde.getFullYear(),desde.getMonth(),desde.getDate());d<addDays(hoy,0);d=addDays(d,1)){if(d.getDay()!==desc)n++}
  return n;
}
function alertasProf(){
  const wk=weekKey(new Date());const out=[];
  S.alumnos.forEach(a=>{
    const sin=diasSinEstudio(a);
    if(a.rutinaPendiente===wk)out.push({a,t:'wait',i:'clock',m:'Propuso su rutina de la semana',tab:'rutina'});
    if(a.ultimaEvidencia&&!a.ultimaEvidencia.revisada)out.push({a,t:'warn',i:'mic',m:'Grabación por revisar',tab:'evidencias'});
    if(sin>=3)out.push({a,t:'warn',i:'bell',m:a.ultimaSesion?'No registra estudio hace '+sin+' días':'Aún no registra estudio',tab:'sesiones'});
    const now=new Date(),hoyMin=(a.dias||{})[today()]||0;
    if(sin<3&&(a.racha||0)>0&&now.getHours()>=RIESGO_H()&&now.getDay()!==+a.descanso&&hoyMin<minDia(+a.ciclo))out.push({a,t:'wait',i:'flame',m:'Racha de '+a.racha+(a.racha===1?' día':' días')+' en riesgo: lleva '+hoyMin+' de '+minDia(+a.ciclo)+' min hoy',tab:'sesiones'});
  });
  return out;
}

      creado:prev&&prev.creado||ahora+i,catalogo:String(it.catalogo||''),epoca:EPOCAS.includes(it.epoca)?it.epoca:'',compases:it.compases||'',tonalidad:String(it.tonalidad||''),compas:String(it.compas||'')};

async function guardarRecursos(cambio,msg){

async function asignarTec(alId,itemId,on){
  const a=destinatarios().find(x=>x.id===alId);if(!a)return;
  const set=new Set(a.tecnica||[]);on?set.add(itemId):set.delete(itemId);const arr=[...set];
  const p='alumnos/'+alId;
  try{await encolar(p,()=>S.db.doc(p).update({tecnica:arr}));a.tecnica=arr;const real=S.alumnos.find(x=>x.id===alId)||(S.pruebaAl&&S.pruebaAl.id===alId?S.pruebaAl:null);if(real)real.tecnica=arr;return true}
  catch(e){toast(errMsg(e),'bad');return false}
}

    S.evidencias.filter(e=>e.comentario&&!e.visto&&!S.marcados.has(e.id)).forEach(e=>{S.marcados.add(e.id);const p='alumnos/'+S.uid+'/evidencias/'+e.id;encolar(p,()=>S.db.doc(p).update({visto:true})).catch(()=>{})});
  }
}

function sub(ref,fn){return ref.onSnapshot(fn,err=>{if(err&&(err.code==='revoked'||err.code==='unavailable')){S.estado='error';render(true)}})}
function iniciarAlumno(){
  const db=S.db,u=S.uid,base='alumnos/'+u;
  sub(db.doc(base),snap=>{
    if(!snap.exists){S.perfil=null;if(S.isOwner){if(!S.sembrando){S.sembrando=true;S.estado='sembrando';render(true);sembrarPrueba().catch(e=>{S.estado='error';render(true)})}return}S.estado='onboarding';render(true);return}
    const nuevo=!S.perfil;S.perfil=snap.data();recalcular();
    /* Cuenta nueva: espera a que la profesora la apruebe (las cuentas antiguas sin estado siguen igual) */
    if(S.sb&&!S.isOwner&&(S.perfil.estado==='pendiente'||S.perfil.estado==='rechazado'||S.perfil.estado==='papelera')){S.estado=S.perfil.estado;render(true);return}
    if(S.estado!=='listo'){const venia=S.estado==='pendiente';S.estado='listo';S.view=vistaDesdeHash();if(venia){celebrar();toast('¡Tu profesora aprobó tu cuenta! Bienvenido a Octavia.')}}
    render(nuevo?true:false);
    if(nuevo)sincronizar();
  });
  sub(db.collection(base+'/obras').orderBy('creado','asc'),snap=>{S.obras=snap.docs.map(d=>({id:d.id,...d.data()}));if(S.perfil)render()});
  sub(db.collection(base+'/sesiones').orderBy('fecha','desc').limit(150),snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S.sesiones=m;recalcular();if(S.perfil)render()});
  sub(db.collection(base+'/rutinas').orderBy('semana','desc').limit(12),snap=>{S.rutinas=snap.docs.map(d=>({id:d.id,...d.data()}));if(S.perfil)render()});
  sub(db.collection(base+'/evidencias').orderBy('creado','desc').limit(60),snap=>{S.evidencias=snap.docs.map(d=>({id:d.id,...d.data()}));if(S.perfil)render()});
  sub(db.collection('eventos').orderBy('fecha','asc'),snap=>{S.eventos=snap.docs.map(d=>({id:d.id,...d.data()})).filter(e=>!e.cfg&&e.fecha);if(S.perfil)render()});
  sub(db.doc(REC_PATH),snap=>{S.recursos=snap.exists?snap.data():{};if(S.perfil)render()});
}
function iniciarProf(){
  S.estado='listo';S.view=vistaDesdeHash();render(true);
  sub(S.db.collection('alumnos'),snap=>{const all=snap.docs.map(d=>({id:d.id,...d.data()}));S.pruebaAl=all.find(a=>a.id===S.ownerId&&a.prueba)||null;const reales=all.filter(a=>a.nombre&&a.id!==S.ownerId&&!a.prueba);S.solicitudes=reales.filter(a=>a.estado==='pendiente').sort((x,y)=>(x.creado||0)-(y.creado||0));S.rechazados=reales.filter(a=>a.estado==='rechazado');S.papelera=reales.filter(a=>a.estado==='papelera').sort((x,y)=>(y.papeleraEn||0)-(x.papeleraEn||0));S.alumnos=reales.filter(a=>a.estado!=='pendiente'&&a.estado!=='rechazado'&&a.estado!=='papelera').sort((x,y)=>String(x.nombre).localeCompare(String(y.nombre)));render()});

/* ───────── Modo Supabase (sitio propio en Vercel y APK) ─────────
   Imita la interfaz que ya usa la app: doc(), collection(), orderBy(), limit(), get(), onSnapshot(), set(), update(), delete().
   Todo se guarda en la tabla «docs» (ver supabase/schema.sql); las reglas RLS deciden quién ve qué. */
function crearSupabase(sb){
  const T='docs',segs=p=>p.split('/'),parentOf=p=>segs(p).slice(0,-1).join('/');
  const subs=new Set();
  const mapErr=e=>{const m=(e&&e.message)||'';if((e&&e.code)==='42501'||/row-level security|permission/i.test(m))return {code:'invalid_argument',message:m};return {code:'unavailable',message:m}};
  const snap=(path,row)=>({id:segs(path).pop(),exists:!!row,data:()=>row?JSON.parse(JSON.stringify(row.data)):undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  const leer=async path=>{const {data,error}=await sb.from(T).select('path,data').eq('path',path).maybeSingle();if(error)throw mapErr(error);return data};
  /* Avisos en vivo: cuando cambia un documento, se vuelven a leer las suscripciones afectadas */
  const pend=new Set();let tmr=null;
  const avisar=path=>{pend.add(path);clearTimeout(tmr);tmr=setTimeout(()=>{const ps=[...pend];pend.clear();subs.forEach(s=>{if(ps.some(p=>s.kind==='doc'?p===s.key:parentOf(p)===s.key))s.run()})},120)};
  try{sb.channel('octavia-docs').on('postgres_changes',{event:'*',schema:'public',table:T},pl=>{const p=(pl.new&&pl.new.path)||(pl.old&&pl.old.path);if(p)avisar(p);else subs.forEach(s=>s.run())}).subscribe()}catch(e){}
  /* Si la pestaña vuelve a estar visible, refresca todo (por si se perdió algún aviso) */
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')subs.forEach(s=>s.run())});
  const merge=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]}};
  const q=(col,o)=>{o=o||{};
    const run=async()=>{const {data,error}=await sb.from(T).select('path,data').eq('parent',col);if(error)throw mapErr(error);
      let ds=(data||[]).map(r=>snap(r.path,r));
      if(o.ob){const [f,d]=o.ob;ds=ds.filter(x=>{const v=x.data()[f];return v!==undefined&&v!==null});ds.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];return (x>y?1:x<y?-1:0)*(d==='desc'?-1:1)})}
      if(o.lim)ds=ds.slice(0,o.lim);return {docs:ds,size:ds.length,empty:!ds.length,docChanges:()=>[],metadata:{}}};
    return {orderBy:(f,d)=>q(col,{...o,ob:[f,d]}),limit:n=>q(col,{...o,lim:n}),where:()=>q(col,o),get:run,
      onSnapshot:(n,onErr)=>{const s={kind:'col',key:col,run:()=>run().then(n,e=>onErr&&onErr(e))};subs.add(s);s.run();return ()=>subs.delete(s)},
      doc:id=>dref(col+'/'+(id||uidGen())),add:async d=>{const r=dref(col+'/'+uidGen());await r.set(d);return r}}};
  const dref=path=>({id:segs(path).pop(),path,
    get:async()=>snap(path,await leer(path)),
    set:async d=>{const {error}=await sb.from(T).upsert({path,parent:parentOf(path),data:JSON.parse(JSON.stringify(d))});if(error)throw mapErr(error);avisar(path)},
    update:async d=>{const cur=await leer(path);if(!cur)throw {code:'invalid_argument',message:'No existe '+path};const nd=cur.data||{};merge(nd,JSON.parse(JSON.stringify(d)));
      const {error}=await sb.from(T).update({data:nd}).eq('path',path);if(error)throw mapErr(error);avisar(path)},
    delete:async()=>{const {error}=await sb.from(T).delete().eq('path',path);if(error)throw mapErr(error);avisar(path)},
    onSnapshot:(n,onErr)=>{const s={kind:'doc',key:path,run:()=>leer(path).then(r=>n(snap(path,r)),e=>onErr&&onErr(e))};subs.add(s);s.run();return ()=>subs.delete(s)},
    collection:c=>q(path+'/'+c)});
  return {doc:dref,collection:c=>q(c)};
}
function supabaseConfigurado(){const c=window.OCTAVIA_SUPABASE||{};return !!(c.url&&c.anonKey&&/^https:\/\//.test(c.url)&&!/TU_/.test(c.url+c.anonKey))}

/* ───────── Modo local (cuando Octavia se abre fuera de Claude) ───────── */
function crearLocal(){
  let store={};try{store=JSON.parse(localStorage.getItem('octavia.db')||'{}')}catch(e){}
  const save=()=>{try{localStorage.setItem('octavia.db',JSON.stringify(store))}catch(e){}};
  const subs=[];const segs=p=>p.split('/');
  const fire=()=>setTimeout(()=>subs.slice().forEach(f=>f()),0);
  const snapDoc=path=>{const d=store[path];return {id:segs(path).pop(),exists:!!d,data:()=>d?JSON.parse(JSON.stringify(d)):undefined,metadata:{fromCache:false,hasPendingWrites:false}}};
  const docsIn=col=>{const n=segs(col).length+1;return Object.keys(store).filter(k=>k.startsWith(col+'/')&&segs(k).length===n)};
  const q=(col,o)=>{o=o||{};const run=()=>{let ds=docsIn(col).map(snapDoc);if(o.ob){const [f,d]=o.ob;ds.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];return (x>y?1:x<y?-1:0)*(d==='desc'?-1:1)})}if(o.lim)ds=ds.slice(0,o.lim);return {docs:ds,size:ds.length,empty:!ds.length,docChanges:()=>[],metadata:{}}};
    return {orderBy:(f,d)=>q(col,{...o,ob:[f,d]}),limit:n=>q(col,{...o,lim:n}),where:()=>q(col,o),get:async()=>run(),
      onSnapshot:n=>{const f=()=>n(run());subs.push(f);setTimeout(f,0);return ()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}},
      doc:id=>dref(col+'/'+(id||uidGen())),add:async d=>{const r=dref(col+'/'+uidGen());await r.set(d);return r}}};
  const merge=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]}};
  const dref=path=>({id:segs(path).pop(),path,get:async()=>snapDoc(path),
    set:async d=>{store[path]=JSON.parse(JSON.stringify(d));save();fire()},
    update:async d=>{if(!store[path])throw {code:'invalid_argument'};merge(store[path],JSON.parse(JSON.stringify(d)));save();fire()},
    delete:async()=>{delete store[path];save();fire()},
    onSnapshot:n=>{const f=()=>n(snapDoc(path));subs.push(f);setTimeout(f,0);return ()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}},
    collection:c=>q(path+'/'+c)});
  return {doc:dref,collection:c=>q(c)};
}

(async function init(){
  let c=window.claude;
  if((!c||!c.use)&&supabaseConfigurado()){
    if(!window.supabase){S.estado='error';render(true);return}
    const cfg=window.OCTAVIA_SUPABASE;
    const sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});S.sb=sb;
    let session=null;try{session=(await sb.auth.getSession()).data.session}catch(e){}
    S.acceso=cfg.acceso||'libre';
    const libre=S.acceso==='libre';
    if(!session&&libre){const r=await sb.auth.signInAnonymously();
      if(r.error){S.estado='sin-anon';S.ui.anonErr=r.error.message;render(true);return}
      session=r.data.session}
    if(!session){S.estado='login';render(true);return}
    S.anon=!!session.user.is_anonymous;
    let prof=false;try{const r=await sb.rpc('es_profesora');prof=!!r.data}catch(e){}
    const sdb=crearSupabase(sb),uid=session.user.id;S.email=session.user.email;S.metaNombre=((session.user.user_metadata||{}).nombre)||'';
    sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
    c={use:async n=>n==='db'?sdb:n==='user'?{isOwner:async()=>prof,id:async()=>uid}:null};
  }
  if(!c||!c.use){S.local=true;const ldb=crearLocal();c={use:async n=>n==='db'?ldb:n==='user'?{isOwner:()=>true,id:async()=>'local'}:null}}
  const db=await c.use('db');
  if(!db){S.estado='sin-db';render(true);return}
  S.db=db;
  const user=await c.use('user');S.user=user;
  let owner=false,id=null;
  try{owner=user?!!(await user.isOwner()):false}catch(e){}
  try{id=user?await user.id():null}catch(e){}
  if(owner){S.isOwner=true;S.ownerId=id;if(ls.get('octavia.modo',S.local?'alumno':'prof')==='alumno'&&id){S.role='alumno';S.uid=id;iniciarAlumno()}else{S.role='prof';iniciarProf()}}
  else if(id){S.role='alumno';S.uid=id;iniciarAlumno()}
  else{S.estado='sin-id';render(true)}
})();
})();
</script>
