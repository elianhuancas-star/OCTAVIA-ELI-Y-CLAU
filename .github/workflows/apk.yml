# Construye el APK de Android en la nube de GitHub (no hace falta Android Studio).
# Para usarlo: GitHub → Actions → «APK de Android» → Run workflow.
# Al terminar, descarga «octavia-apk» en la sección Artifacts de esa ejecución.
name: APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor
        run: npm install

      - name: Preparar la web del APK
        run: node scripts/preparar-www.js
        env:
          OCTAVIA_URL: ${{ vars.OCTAVIA_URL }}

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: octavia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
