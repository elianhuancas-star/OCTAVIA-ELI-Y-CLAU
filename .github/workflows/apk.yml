# Construye el APK de Android en la nube de GitHub (no hace falta Android Studio).
# Se ejecuta solo al cambiar esta configuración, o a mano: GitHub → Actions → «APK de Android» → Run workflow.
# Al terminar, el APK queda en la web: https://octavia-eli-y-clau.vercel.app/descargas/octavia.apk
# (y también en «Artifacts» de la ejecución).
name: APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/preparar-www.js'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor
        run: npm install

      - name: Preparar la web del APK
        run: node scripts/preparar-www.js
        env:
          # El APK abre la web publicada: siempre muestra la última versión sin reinstalar.
          OCTAVIA_URL: ${{ vars.OCTAVIA_URL || 'https://octavia-eli-y-clau.vercel.app' }}

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: octavia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar el APK en la web (descargas/octavia.apk)
        run: |
          mkdir -p descargas
          cp android/app/build/outputs/apk/debug/app-debug.apk descargas/octavia.apk
          git checkout -- capacitor.config.json
          git config user.name "octavia-bot"
          git config user.email "octavia-bot@users.noreply.github.com"
          git add descargas/octavia.apk
          git commit -m "APK de Android actualizado" || echo "Sin cambios en el APK"
          git pull --rebase origin main
          git push origin HEAD:main
